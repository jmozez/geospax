# GeoSpaX CI: build + test on every push/PR; on a version tag (v1.1.0, ...) also publish the
# Linux and Windows installers to a GitHub release and the web-edition image to GHCR.
# The Windows edition is cross-built on Linux (scripts/package-windows.sh), smoke-tested under Wine,
# then installed and started on a real Windows runner (the desktop window needs WebView2).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v3.0.2); leave empty for a plain build"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  linux:
    name: build and test (Debian 13)
    runs-on: ubuntu-latest
    # Debian 13 = GDAL 3.10, the same stack the release was tested on
    container: debian:trixie
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Tools for checkout
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: System packages, Rust, Node (scripts/setup-linux.sh)
        run: bash scripts/setup-linux.sh
      - uses: actions/cache@v4
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
          key: cargo-trixie-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-trixie-
      - name: Publisher is in4metrix in every package (Windows installer and version info, Flatpak, deb, rpm)
        run: bash scripts/check-publisher.sh
      - name: Docs links and anchors
        run: python3 scripts/test-docs-links.py README.md CHANGELOG.md SECURITY.md bench/RESULTS.md docs/*.md
      - name: Web UI (type check + build)
        working-directory: web
        run: npm ci --no-audit --no-fund && npx tsc --noEmit && npx vite build
      - name: GSX plugin (analysis tests; bundle and manifest match the source)
        working-directory: plugins/gsx
        run: sha256sum run.mjs plugin.yaml ../geospax-*/plugin.yaml > /tmp/gsx.sha && npm ci --no-audit --no-fund && npx tsc -p . && npm test && npm run build && node gen-manifest.mjs && sha256sum -c /tmp/gsx.sha
      - name: Tool dialogs pre-select fitting inputs (every GSX tool)
        run: node --experimental-strip-types --no-warnings scripts/test-prefill.mjs
      - name: Profile chart (distance, min, max, climb, A and B, km ticks)
        run: node --experimental-strip-types --no-warnings scripts/test-profile.mjs
      - name: Engine unit tests
        run: . /opt/rust-env.sh && cargo test --release -p geospax-engine
      - name: Release build (server + desktop)
        run: . /opt/rust-env.sh && cargo build --release -p geospax-server -p geospax --features geospax/custom-protocol
      - name: Recipe gallery check
        run: |
          for r in recipes/*.yaml; do ./target/release/geospax-server check "$r"; done
      - name: Editing, selection and the attribute table (GeoJSON, Shapefile, projected GeoPackage)
        run: |
          python3 scripts/test-edit-data.py /tmp/ed/data
          ./target/release/geospax-server --data /tmp/ed/data --state-dir /tmp/ed/state --web web/dist --port 18091 --no-device-mounts --no-triggers > /tmp/ed/server.log 2>&1 &
          pid=$!
          for i in $(seq 30); do curl -fs http://127.0.0.1:18091/api/health >/dev/null && break; sleep 1; done
          python3 scripts/test-edit.py http://127.0.0.1:18091 || { cat /tmp/ed/server.log; exit 1; }
          kill "$pid"
      - name: Exact zonal statistics, topology check, split / merge / cut / reshape, layer downloads
        run: python3 scripts/test-ribbon-tools.py target/release/geospax-server
      - name: Ribbon tools in a real browser (Playwright Chromium)
        run: |
          npm i --prefix /tmp/pw --no-audit --no-fund playwright@1.64.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps --only-shell chromium
          rm -rf /tmp/rb && python3 scripts/test-edit-data.py /tmp/rb/data
          ./target/release/geospax-server --data /tmp/rb/data --state-dir /tmp/rb/state --web web/dist --port 18120 --no-device-mounts --no-triggers > /tmp/rb/server.log 2>&1 &
          pid=$!
          for i in $(seq 30); do curl -fs http://127.0.0.1:18120/api/health >/dev/null && break; sleep 1; done
          PW=/tmp/pw/node_modules/playwright node scripts/test-web-ribbon.mjs http://127.0.0.1:18120 /tmp/rb/shots || { cat /tmp/rb/server.log; exit 1; }
          kill "$pid"
      - name: Ribbon critical behaviour (swipe drag, spyglass, toggle highlighting, Export splits, named projects)
        run: |
          rm -rf /tmp/rc && python3 scripts/test-edit-data.py /tmp/rc/data
          ./target/release/geospax-server --data /tmp/rc/data --state-dir /tmp/rc/state --web web/dist --port 18122 --no-device-mounts --no-triggers > /tmp/rc/server.log 2>&1 &
          pid=$!
          for i in $(seq 30); do curl -fs http://127.0.0.1:18122/api/health >/dev/null && break; sleep 1; done
          PW=/tmp/pw/node_modules/playwright node scripts/test-ribbon-critical.mjs http://127.0.0.1:18122 /tmp/rc/shots || { cat /tmp/rc/server.log; exit 1; }
          kill "$pid"
      - name: Ribbon audit (every item on every tab clicked, effect and highlighting checked)
        timeout-minutes: 45
        run: |
          rm -rf /tmp/ra && python3 scripts/test-edit-data.py /tmp/ra/data
          ./target/release/geospax-server --data /tmp/ra/data --state-dir /tmp/ra/state --web web/dist --port 18125 --no-device-mounts --no-triggers > /tmp/ra/server.log 2>&1 &
          pid=$!
          for i in $(seq 30); do curl -fs http://127.0.0.1:18125/api/health >/dev/null && break; sleep 1; done
          PW=/tmp/pw/node_modules/playwright node scripts/test-ribbon-audit.mjs http://127.0.0.1:18125 /tmp/ra/out --strict || { tail -50 /tmp/ra/server.log; exit 1; }
          kill "$pid"
      - name: Field app GPS filter
        run: node --experimental-strip-types --no-warnings scripts/test-field-gps.mjs
      - name: Assistant (Ollama, OpenAI-compatible and Claude wire formats, scripted model) and MCP server
        run: python3 scripts/test-ai.py target/release/geospax-server /tmp/ed/data
      - name: Satellite embeddings (known landscapes in a local AlphaEarth-layout mirror)
        run: |
          python3 -c "import numpy" 2>/dev/null || apt-get install -y -q --no-install-recommends python3-numpy
          python3 scripts/test-embeddings.py target/release/geospax-server
      - name: Your own ONNX model (fixture models with known answers)
        run: python3 scripts/test-detect.py target/release/geospax-server
      - name: The default domain plugins and industry kits against known answers
        run: python3 scripts/test-domain-plugins.py target/release/geospax-server
      - name: Plan-B data (GEBCO, Hansen forest change, ecoregions, WoRMS) against local mirrors with known answers
        run: python3 scripts/test-plan-b.py target/release/geospax-server
      - name: Equal Earth for exported maps (world map chooses it, rasters warped and cut at the outline)
        run: python3 scripts/test-equal-earth.py target/release/geospax-server
      - name: Sensor networks (MQTT over TLS, LoRaWAN, SensorThings) against Mosquitto
        run: |
          apt-get install -y -q --no-install-recommends mosquitto openssl
          python3 scripts/data-sample-field.py /tmp/gx-data
          mkdir -p /tmp/gx-out
          python3 scripts/test-sensor-networks.py --bin target/release/geospax-server --data /tmp/gx-data --out /tmp/gx-out
      - name: LiDAR + 3D scenes (known truth, real LAS/LAZ samples, drop-folder trigger, glTF validator)
        run: |
          python3 -c "import numpy, PIL" 2>/dev/null || apt-get install -y -q --no-install-recommends python3-numpy python3-pil
          npm i --prefix /tmp/gv --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
          python3 scripts/test-lidar.py --bin target/release/geospax-server --out /tmp/gx-out --quick --results /tmp/gx-out/lidar-results.json \
            --validator /tmp/gv/node_modules/gltf-validator
      - name: Spatial statistics (hot spots + kriging vs known truth, cross-checked with R spdep and gstat)
        run: |
          apt-get install -y -q --no-install-recommends r-base-core r-base-dev r-cran-sf r-cran-spdep r-cran-jsonlite r-cran-sp r-cran-zoo r-cran-xts
          # Debian 13 dropped r-cran-gstat: take it from CRAN (with whatever it needs that Debian lacks)
          apt-get install -y -q --no-install-recommends r-cran-gstat 2>/dev/null \
            || Rscript -e 'install.packages("gstat", repos = "https://cloud.r-project.org", Ncpus = 4)'
          python3 scripts/test-stats.py --bin target/release/geospax-server --data /tmp/gx-data --quick --results /tmp/gx-out/stats-results.json
      - name: Web services in the Explorer (WMS, WMTS, XYZ, ArcGIS, OGC API against a local mock)
        run: python3 scripts/test-services.py --bin target/release/geospax-server
      - name: PostGIS databases in the Explorer (throwaway PostgreSQL + PostGIS)
        run: |
          apt-get install -y -q --no-install-recommends postgresql postgresql-postgis util-linux
          GEOSPAX_REQUIRE_POSTGIS=1 python3 scripts/test-postgis.py --bin target/release/geospax-server

  appimage:
    name: AppImage (all Linux distributions; built on Ubuntu 24.04)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Tools for checkout
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: System packages, Rust, Node (scripts/setup-linux.sh)
        run: bash scripts/setup-linux.sh
      - uses: actions/cache@v4
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
          key: cargo-ubuntu2404-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ubuntu2404-
      - name: Build the AppImage
        run: bash scripts/package-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: geospax-appimage
          path: releases/GeoSpaX-*.AppImage*

  appimage-test:
    name: AppImage runs on ${{ matrix.distro }}
    needs: appimage
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        # only the libraries every graphical desktop has (graphics drivers, X11/Wayland, fonts); the
        # AppImage brings GDAL, PROJ, WebKitGTK and the rest itself
        include:
          - distro: fedora:44
            desktop: dnf install -y -q mesa-libEGL mesa-libGL mesa-libgbm libdrm fontconfig harfbuzz fribidi libX11 libX11-xcb libxcb libwayland-client
          - distro: archlinux:latest
            desktop: pacman -Sy --noconfirm -q mesa fontconfig harfbuzz fribidi libx11 libxcb wayland libdrm
          - distro: opensuse/tumbleweed:latest
            desktop: for i in 1 2 3; do zypper -n -q --gpg-auto-import-keys refresh && zypper -n -q install Mesa-libEGL1 Mesa-libGL1 libgbm1 libdrm2 fontconfig libharfbuzz0 libfribidi0 libX11-6 libX11-xcb1 libxcb1 libwayland-client0 libcom_err2 libgpg-error0 findutils && break; sleep 30; done
          - distro: debian:13
            desktop: apt-get update -q && apt-get install -y -q --no-install-recommends libegl1 libgl1 libgbm1 libdrm2 libfontconfig1 libharfbuzz0b libfribidi0 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libgpg-error0 libcom-err2
    steps:
      - name: Desktop libraries of ${{ matrix.distro }}
        run: ${{ matrix.desktop }}
      - uses: actions/download-artifact@v4
        with:
          name: geospax-appimage
      - name: Run it (engine, GDAL, recipe steps)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          A=$(ls GeoSpaX-*.AppImage); chmod +x "$A"
          # every library the host still lacks, all at once (a desktop has them; a bare container may not)
          ./"$A" --appimage-extract > /dev/null && LD_LIBRARY_PATH=squashfs-root/usr/lib ldd squashfs-root/usr/bin/geospax | grep "not found" || true
          ./"$A" --version
          ./"$A" steps | grep -q "data.fetch"
          ./"$A" recipes > /dev/null
          echo "OK on ${{ matrix.distro }}"

  flatpak:
    name: Flatpak (io.github.jmozez.GeoSpaX, for Flathub)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: GeoSpaX.flatpak
          manifest-path: packaging/flatpak/io.github.jmozez.GeoSpaX.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.yml') }}
      - name: Metadata as Flathub checks it
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream packaging/flatpak/io.github.jmozez.GeoSpaX.metainfo.xml || \
            appstreamcli validate --no-net packaging/flatpak/io.github.jmozez.GeoSpaX.metainfo.xml

  android:
    name: Android field app (APK)
    runs-on: ubuntu-latest
    env:
      # optional: a base64-encoded release keystore, so each APK installs as an update of the last
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and NDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_NDK_LATEST_HOME" > /dev/null && ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust targets for Android phones
        run: rustup target add aarch64-linux-android armv7-linux-androideabi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/field/src-tauri/target
          key: cargo-android-${{ hashFiles('apps/field/src-tauri/Cargo.toml') }}
          restore-keys: cargo-android-
      - name: Release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build + sign the APK
        run: bash scripts/package-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: geospax-field-apk
          path: releases/GeoSpaX-Field-*.apk

  android-emulator:
    name: Android field app on the emulator (GPS, pairing, sending)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Android SDK and NDK, GDAL for geospax-server
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgdal-dev clang libclang-dev
          rustup target add x86_64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/field/src-tauri/target
          key: cargo-emulator-${{ hashFiles('Cargo.lock', 'apps/field/src-tauri/Cargo.toml') }}
          restore-keys: cargo-emulator-
      - name: GPS filter (unit test)
        run: node --experimental-strip-types --no-warnings scripts/test-field-gps.mjs
      - name: geospax-server (the computer side of the phone link)
        run: cargo build --release -p geospax-server
      - name: Debug APK for the emulator (x86_64)
        run: bash scripts/package-android.sh --emulator
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/ci-field-emulator.sh releases/GeoSpaX-Field-emulator.apk target/release/geospax-server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-emulator
          path: |
            releases/field-emulator*.png
            releases/emulator-server.log

  windows:
    name: Windows installer (cross-built on Debian 13, tested under Wine)
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      CARGO_TERM_COLOR: always
      # optional: a base64-encoded .pfx code-signing certificate; without it the installer is unsigned
      WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
      # optional: the updater key (npx tauri signer generate); with it, installed copies update in place
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Tools for checkout
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Rust, Node, MinGW-w64, NSIS, Wine, GDAL for Windows (scripts/setup-linux.sh --windows)
        run: bash scripts/setup-linux.sh --windows && apt-get install -y -q --no-install-recommends xvfb mosquitto openssl python3-numpy
      - uses: actions/cache@v4
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target/x86_64-pc-windows-gnu
          key: cargo-windows-gnu-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-gnu-
      - name: Web UI
        run: (cd web && npm ci --no-audit --no-fund && npx vite build) && (cd apps/desktop && npm ci --no-audit --no-fund)
      - name: Code-signing certificate
        if: env.WINDOWS_SIGN_PFX_BASE64 != ''
        run: |
          echo "$WINDOWS_SIGN_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/sign.pfx"
          echo "WINDOWS_SIGN_PFX=$RUNNER_TEMP/sign.pfx" >> "$GITHUB_ENV"
      - name: Build + package (installer + portable ZIP)
        run: scripts/package-windows.sh
      - name: Install + smoke test under Wine
        run: |
          python3 scripts/data-sample-field.py /tmp/gx-data
          python3 scripts/data-sample-devices.py /tmp/geospax-devices
          GEOSPAX_DATA=/tmp/gx-data scripts/test-package-windows.sh releases/GeoSpaX_*_x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: geospax-windows
          path: |
            releases/GeoSpaX_*_x64-setup.exe
            releases/GeoSpaX_*_x64-setup.exe.sig
            target/windows/GeoSpaX-*-windows-x64.zip

  windows-native:
    name: Windows installer on Windows (desktop window + web server)
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: geospax-windows
          path: dist
      - name: Upgrades over 3.0.2 (old publisher), 3.0.6 and a half-removed install leave one GeoSpaX (clicked through and /P)
        timeout-minutes: 45
        run: |
          $setup = Get-ChildItem dist -Recurse -Filter 'GeoSpaX_*_x64-setup.exe' | Select-Object -First 1
          & ./scripts/test-windows-upgrade.ps1 -Setup $setup.FullName
      - name: Silent per-user install
        run: |
          $setup = Get-ChildItem dist -Recurse -Filter 'GeoSpaX_*_x64-setup.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $inst = "$env:LOCALAPPDATA\GeoSpaX"
          if (-not (Test-Path "$inst\geospax.exe")) { throw "GeoSpaX was not installed to $inst" }
          "INST=$inst" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$inst\geospax-server.exe" recipes
      - name: Desktop app starts and creates ~/GeoSpaX
        run: |
          $p = Start-Process "$env:INST\geospax.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "the desktop app exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$env:USERPROFILE\GeoSpaX\Inbox")) { throw "no GeoSpaX folder layout in the user profile" }
          Stop-Process -Id $p.Id
      - name: Web server answers and renders a recipe map
        run: |
          $data = "$env:USERPROFILE\GeoSpaX\Data"
          $s = Start-Process "$env:INST\geospax-server.exe" -ArgumentList '--data', $data, '--port', '18320', '--no-device-mounts' -PassThru
          $h = $null
          for ($i = 0; $i -lt 60 -and -not $h; $i++) { try { $h = Invoke-RestMethod http://127.0.0.1:18320/api/health } catch { Start-Sleep 1 } }
          if (-not $h.ok) { throw "the web server did not answer" }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18320/).Content -notmatch 'GeoSpaX') { throw "no web UI" }
          Stop-Process -Id $s.Id
      - name: Silent uninstall
        run: |
          Start-Process "$env:INST\uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 15
          if (Test-Path "$env:INST\geospax.exe") { throw "GeoSpaX is still installed" }

  release:
    name: GitHub release
    # on a pushed tag, or from "Run workflow" with a release tag (the release then creates the tag)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [linux, flatpak, appimage-test, android, android-emulator, windows-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the version being built
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$TAG" = "v$v" ] || { echo "::error::release tag $TAG but Cargo.toml says $v"; exit 1; }
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
      - name: Run again from Run workflow? Replace a release of this tag made from an older commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          old=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$old" ] && [ "$old" != "$GITHUB_SHA" ]; then
            gh release delete "$TAG" --cleanup-tag --yes || git push origin ":refs/tags/$TAG"
          fi
        env:
          TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: geospax-windows
          path: releases
      - uses: actions/download-artifact@v4
        with:
          name: geospax-appimage
          path: releases
      - uses: actions/download-artifact@v4
        with:
          name: geospax-field-apk
          path: releases
      - name: Update feed (latest.json) from the updater signatures
        run: python3 scripts/update-feed.py "$TAG" releases
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            releases/**/GeoSpaX-*.AppImage
            releases/**/GeoSpaX-*.AppImage.sig
            releases/**/GeoSpaX-Field-*.apk
            releases/**/GeoSpaX_*_x64-setup.exe
            releases/**/GeoSpaX_*_x64-setup.exe.sig
            releases/**/latest.json
            releases/**/GeoSpaX-*-windows-x64.zip
          generate_release_notes: true

  docker:
    name: web-edition image
    # built on every push and PR so a broken Dockerfile shows up before a release; pushed to GHCR on tags and on a release from Run workflow
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ startsWith(inputs.release_tag, 'v') }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fly:
    name: deploy the web app (geospax.fly.dev)
    # each release: the new image goes live on Fly. Needs the FLY_API_TOKEN secret
    # (fly tokens create deploy -a geospax); without it this job says so and does nothing.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [docker, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy the release image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN is not set: the web app was not updated (fly deploy -a geospax by hand)"
            exit 0
          fi
          flyctl deploy -a geospax --config fly.toml --ha=false --image "ghcr.io/jmozez/geospax:${TAG#v}"
          curl -sf https://geospax.fly.dev/api/health
