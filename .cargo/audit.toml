# cargo audit settings (CI: Supply chain job). Every ignore needs a reason and a way out.
[advisories]
ignore = [
  # libsqlite3-sys 0.35 (C SQLite CVE). Only reachable through the optional `bundled-gdal` feature
  # (gdal-sys/bundled -> gdal-src -> proj-sys 0.27), which no build or release enables: shipped builds
  # link the system GDAL and SQLite. proj-sys 0.27 pins libsqlite3-sys below 0.39; drop this line when
  # gdal-src moves to proj-sys 0.28.
  "RUSTSEC-2026-0459",
]
