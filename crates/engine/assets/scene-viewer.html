<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font:13px/1.4 "DejaVu Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1b2631;background:linear-gradient(#b9d0e8,#eef3f7 70%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas.drag{cursor:grabbing}
#hud{position:absolute;left:14px;top:10px;max-width:52%;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.7)}
#hud h1{font-size:17px;margin:0;line-height:1.25}
#hud p{margin:3px 0 0;color:#33424f}
#bar{position:absolute;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:46%}
#bar label,#bar button{background:rgba(255,255,255,.93);border:1px solid #c5d0da;border-radius:8px;padding:5px 10px;font:inherit;color:#1b2631;cursor:pointer;user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
#bar label input{margin:0 6px 0 0;vertical-align:-2px}
#bar button.on{background:#14212b;color:#fff;border-color:#14212b}
#help{position:absolute;left:14px;bottom:10px;color:#3d4d5b;font-size:12px;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.7)}
#help b{font-weight:600}
#compass{position:absolute;right:14px;bottom:12px;width:48px;height:48px;cursor:pointer}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:40px;text-align:center;color:#7a2a20;font-size:15px;background:rgba(255,255,255,.85)}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D scene: drag to rotate, scroll to zoom"></canvas>
<div id="hud"><h1 id="title"></h1><p id="sub"></p></div>
<div id="bar"></div>
<div id="help"><b>Drag</b> to turn · <b>right-drag</b> or <b>Shift-drag</b> to move · <b>scroll</b> or <b>pinch</b> to zoom · <b>double-click</b> to reset · made with GeoSpaX</div>
<svg id="compass" viewBox="-24 -24 48 48" role="button" aria-label="Turn to face north"><title>Click to face north</title><circle r="22" fill="rgba(255,255,255,.93)" stroke="#c5d0da"/><g id="needle"><path d="M0,-18 L6,2 L-6,2Z" fill="#c0392b"/><path d="M0,18 L6,2 L-6,2Z" fill="#8a96a3"/><text y="-7" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="DejaVu Sans,sans-serif">N</text></g></svg>
<div id="err"></div>
<script type="application/json" id="meta">__META__</script>
<script type="text/plain" id="glb">__GLB__</script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var meta = {};
  try { meta = JSON.parse($('meta').textContent) || {}; } catch (e) { meta = {}; }
  var canvas = $('c');
  function fail(msg) {
    var e = $('err');
    e.textContent = msg;
    e.style.display = 'flex';
    document.body.setAttribute('data-ready', 'error');
  }
  $('title').textContent = meta.title || document.title;
  $('sub').textContent = meta.subtitle || '';

  var attrs = { antialias: true, preserveDrawingBuffer: true, alpha: true, premultipliedAlpha: true };
  var gl = null, gl2 = false;
  try { gl = canvas.getContext('webgl2', attrs); gl2 = !!gl; } catch (e) { gl = null; }
  if (!gl) { try { gl = canvas.getContext('webgl', attrs) || canvas.getContext('experimental-webgl', attrs); } catch (e) { gl = null; } }
  if (!gl) { fail('This browser cannot draw 3D (WebGL is turned off or not supported). The same scene is saved as scene.glb (Blender, Windows 3D Viewer, ArcGIS Pro) and as the picture scene.png.'); return; }

  // ------------------------------------------------------------------ the embedded glTF binary
  var bytes, doc, binStart;
  try {
    var bin = atob($('glb').textContent.replace(/\s+/g, ''));
    bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var dv = new DataView(bytes.buffer);
    if (dv.getUint32(0, true) !== 0x46546c67) throw new Error('not glTF');
    var jsonLen = dv.getUint32(12, true);
    doc = JSON.parse(new TextDecoder().decode(bytes.subarray(20, 20 + jsonLen)));
    binStart = 20 + jsonLen + 8;
  } catch (e) { fail('The scene data could not be read (' + e.message + ').'); return; }
  function viewBytes(i) {
    var bv = doc.bufferViews[i];
    var o = binStart + (bv.byteOffset || 0);
    return bytes.subarray(o, o + bv.byteLength);
  }
  var COMP = { 5121: Uint8Array, 5123: Uint16Array, 5125: Uint32Array, 5126: Float32Array };
  var SIZE = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 };
  function accessor(i) {
    var a = doc.accessors[i], T = COMP[a.componentType], raw = viewBytes(a.bufferView);
    return { data: new T(bytes.buffer, raw.byteOffset + (a.byteOffset || 0), a.count * SIZE[a.type]), size: SIZE[a.type], ctype: a.componentType, norm: !!a.normalized, count: a.count, min: a.min, max: a.max };
  }

  // ------------------------------------------------------------------ GPU program
  var VS = 'attribute vec3 aPos;attribute vec4 aCol;attribute vec2 aUv;' +
    'uniform mat4 uMvp;uniform vec3 uEye;uniform float uPt;uniform vec2 uFogR;' +
    'varying vec4 vCol;varying vec2 vUv;varying float vFog;' +
    'void main(){gl_Position=uMvp*vec4(aPos,1.0);vCol=aCol;vUv=aUv;' +
    'vFog=smoothstep(uFogR.x,uFogR.y,distance(aPos,uEye))*0.35;gl_PointSize=uPt;}';
  var FS = 'precision mediump float;uniform sampler2D uTex;uniform float uTexOn;uniform vec3 uFog;' +
    'varying vec4 vCol;varying vec2 vUv;varying float vFog;' +
    'void main(){vec4 c=uTexOn>0.5?texture2D(uTex,vUv):vCol;gl_FragColor=vec4(mix(c.rgb,uFog,vFog),1.0);}';
  function shader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
    gl.bindAttribLocation(prog, 0, 'aPos');
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { fail('3D drawing failed to start (' + e.message + ').'); return; }
  var loc = {};
  ['aPos', 'aCol', 'aUv'].forEach(function (n) { loc[n] = gl.getAttribLocation(prog, n); });
  ['uMvp', 'uEye', 'uPt', 'uFogR', 'uTex', 'uTexOn', 'uFog'].forEach(function (n) { loc[n] = gl.getUniformLocation(prog, n); });
  var uint32 = gl2 || !!gl.getExtension('OES_element_index_uint');

  function buffer(target, data) {
    var b = gl.createBuffer();
    gl.bindBuffer(target, b);
    gl.bufferData(target, data, gl.STATIC_DRAW);
    return b;
  }

  // ------------------------------------------------------------------ meshes
  var draws = [], groups = {}, order = [], triangles = 0, points = 0, fitPts = [];
  var lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  (doc.meshes || []).forEach(function (m) {
    var g = (m.extras && m.extras.group) || 'other';
    if (!groups[g]) { groups[g] = { on: true }; order.push(g); }
    m.primitives.forEach(function (p) {
      var pos = accessor(p.attributes.POSITION);
      var d = { group: g, points: p.mode === 0, count: pos.count, pos: buffer(gl.ARRAY_BUFFER, pos.data), tex: null, texIndex: -1 };
      if (!d.points && pos.min && pos.max) {
        for (var k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], pos.min[k]); hi[k] = Math.max(hi[k], pos.max[k]); }
      }
      if (p.attributes.COLOR_0 != null) {
        var c = accessor(p.attributes.COLOR_0);
        d.col = buffer(gl.ARRAY_BUFFER, c.data); d.colSize = c.size; d.colType = c.ctype; d.colNorm = c.norm || c.ctype !== 5126;
      }
      if (p.attributes.TEXCOORD_0 != null) d.uv = buffer(gl.ARRAY_BUFFER, accessor(p.attributes.TEXCOORD_0).data);
      var mat = doc.materials && doc.materials[p.material];
      var bct = mat && mat.pbrMetallicRoughness && mat.pbrMetallicRoughness.baseColorTexture;
      if (bct && doc.textures) d.texIndex = doc.textures[bct.index].source;
      if (p.indices != null) {
        var ix = accessor(p.indices);
        if (ix.ctype === 5125 && !uint32) return;
        // a few hundred drawn vertices per primitive, to frame the model tightly
        for (var q = 0, st = Math.max(1, Math.floor(ix.count / 400)); q < ix.count; q += st) {
          var vi = ix.data[q] * 3;
          fitPts.push([pos.data[vi], pos.data[vi + 1], pos.data[vi + 2]]);
        }
        d.idx = buffer(gl.ELEMENT_ARRAY_BUFFER, ix.data); d.count = ix.count; d.itype = ix.ctype === 5125 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;
        triangles += ix.count / 3;
      }
      if (d.points) points += pos.count;
      draws.push(d);
    });
  });
  if (!draws.length) { fail('The scene is empty.'); return; }
  if (!isFinite(lo[0])) { lo = [-1, -1, -1]; hi = [1, 1, 1]; }

  var textures = [];
  function loadTextures(done) {
    var imgs = doc.images || [], left = imgs.length;
    if (!left) { done(); return; }
    imgs.forEach(function (im, i) {
      var blob = new Blob([viewBytes(im.bufferView)], { type: im.mimeType || 'image/jpeg' });
      function upload(src) {
        var t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
        var pot = (src.width & (src.width - 1)) === 0 && (src.height & (src.height - 1)) === 0;
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        if (gl2 || pot) {
          gl.generateMipmap(gl.TEXTURE_2D);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        } else gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        var an = gl.getExtension('EXT_texture_filter_anisotropic') || gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
        if (an) gl.texParameterf(gl.TEXTURE_2D, an.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
        textures[i] = t;
        if (--left === 0) done();
      }
      function viaImage() {
        var img = new Image();
        img.onload = function () { upload(img); };
        img.onerror = function () { if (--left === 0) done(); };
        img.src = URL.createObjectURL(blob);
      }
      if (window.createImageBitmap) createImageBitmap(blob).then(upload, viaImage);
      else viaImage();
    });
  }

  // ------------------------------------------------------------------ camera
  var FOV = 40 * Math.PI / 180;
  var diag = Math.max(Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]), 1);
  var view0 = meta.view || {};
  var home = { t: [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2], bearing: view0.azimuth != null ? view0.azimuth : 200, el: view0.elevation != null ? view0.elevation : 35, dist: diag * 1.15 };
  var cam = { t: home.t.slice(), bearing: home.bearing, el: home.el, dist: home.dist };
  var spin = false, pointSize = 2.0;
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function eye() {
    var b = cam.bearing * Math.PI / 180, e = cam.el * Math.PI / 180, ce = Math.cos(e);
    return [cam.t[0] + cam.dist * Math.sin(b) * ce, cam.t[1] + cam.dist * Math.sin(e), cam.t[2] - cam.dist * Math.cos(b) * ce];
  }
  function perspective(fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
  }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function norm(a) { var l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function lookAt(e, t) {
    var z = norm(sub(e, t)), x = norm(cross([0, 1, 0], z)), y = cross(z, x);
    return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1];
  }
  function mul(a, b) {
    var o = new Array(16);
    for (var c = 0; c < 4; c++) for (var r = 0; r < 4; r++) {
      var s = 0;
      for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
    return o;
  }
  function pan(dx, dy) {
    var s = cam.dist * 2 * Math.tan(FOV / 2) / Math.max(canvas.clientHeight, 1);
    var rb = (cam.bearing - 90) * Math.PI / 180, fb = (cam.bearing + 180) * Math.PI / 180;
    var fy = s / Math.max(Math.sin(cam.el * Math.PI / 180), 0.35);
    cam.t[0] += -Math.sin(rb) * dx * s + Math.sin(fb) * dy * fy;
    cam.t[2] += Math.cos(rb) * dx * s - Math.cos(fb) * dy * fy;
  }
  function zoom(f) { cam.dist = clamp(cam.dist * f, diag * 0.02, diag * 8); }
  // frame the drawn model: the distance at which it spans 86 % of the width or 80 % of the
  // height, centred (three passes, since re-centring changes the perspective a little);
  // sets home.t and home.dist
  function extentAt(aspect) {
    var m = mul(perspective(FOV, aspect, cam.dist * 0.01, cam.dist + diag * 3), lookAt(eye(), cam.t));
    var e = [Infinity, -Infinity, Infinity, -Infinity];
    for (var k = 0; k < fitPts.length; k++) {
      var c = fitPts[k];
      var w = m[3] * c[0] + m[7] * c[1] + m[11] * c[2] + m[15];
      if (w <= 0) return null;
      var x = (m[0] * c[0] + m[4] * c[1] + m[8] * c[2] + m[12]) / w, y = (m[1] * c[0] + m[5] * c[1] + m[9] * c[2] + m[13]) / w;
      if (x < e[0]) e[0] = x;
      if (x > e[1]) e[1] = x;
      if (y < e[2]) e[2] = y;
      if (y > e[3]) e[3] = y;
    }
    return e;
  }
  function fit() {
    var aspect = Math.max(canvas.clientWidth, 1) / Math.max(canvas.clientHeight, 1);
    if (!fitPts.length) return;
    cam.t = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2];
    cam.bearing = home.bearing;
    cam.el = home.el;
    for (var pass = 0; pass < 3; pass++) {
      var a = diag * 0.02, b = diag * 8;
      for (var it = 0; it < 36; it++) {
        cam.dist = (a + b) / 2;
        var e = extentAt(aspect);
        if (e && (e[1] - e[0]) / 2 <= 0.86 && (e[3] - e[2]) / 2 <= 0.8) b = cam.dist; else a = cam.dist;
      }
      cam.dist = b;
      var f = extentAt(aspect);
      if (!f) break;
      // move the target so the model's middle lands in the middle of the window (a touch low,
      // clear of the title and switches)
      var mx = (f[0] + f[1]) / 2, my = (f[2] + f[3]) / 2 + 0.04, ht = cam.dist * Math.tan(FOV / 2);
      var v = lookAt(eye(), cam.t);
      var right = [v[0], v[4], v[8]], up = [v[1], v[5], v[9]];
      for (var k = 0; k < 3; k++) cam.t[k] += right[k] * mx * ht * aspect + up[k] * my * ht;
    }
    home.t = cam.t.slice();
    home.dist = cam.dist;
  }
  function reset() { fit(); dirty(); }

  // ------------------------------------------------------------------ drawing
  var queued = false;
  function dirty() { if (!queued) { queued = true; requestAnimationFrame(frame); } }
  function frame() {
    queued = false;
    if (spin) { cam.bearing = (cam.bearing + 0.2) % 360; dirty(); }
    draw();
  }
  function draw() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = Math.max(1, Math.round(canvas.clientWidth * dpr)), H = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    var e = eye();
    var near = Math.max(cam.dist * 0.02, 0.05), far = cam.dist + diag * 2.5;
    var mvp = mul(perspective(FOV, W / H, near, far), lookAt(e, cam.t));
    gl.useProgram(prog);
    gl.uniformMatrix4fv(loc.uMvp, false, new Float32Array(mvp));
    gl.uniform3fv(loc.uEye, new Float32Array(e));
    gl.uniform2f(loc.uFogR, cam.dist * 0.9, cam.dist + diag * 1.6);
    gl.uniform3f(loc.uFog, 0.90, 0.93, 0.96);
    gl.uniform1i(loc.uTex, 0);
    var ptPx = clamp(pointSize * Math.sqrt(home.dist / cam.dist), 1.2, 7) * dpr;
    gl.uniform1f(loc.uPt, ptPx);
    draws.forEach(function (d) {
      if (!groups[d.group].on) return;
      gl.bindBuffer(gl.ARRAY_BUFFER, d.pos);
      gl.enableVertexAttribArray(loc.aPos);
      gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, 0, 0);
      if (loc.aCol >= 0) {
        if (d.col) {
          gl.bindBuffer(gl.ARRAY_BUFFER, d.col);
          gl.enableVertexAttribArray(loc.aCol);
          gl.vertexAttribPointer(loc.aCol, d.colSize, d.colType === 5126 ? gl.FLOAT : d.colType === 5123 ? gl.UNSIGNED_SHORT : gl.UNSIGNED_BYTE, d.colNorm, 0, 0);
        } else { gl.disableVertexAttribArray(loc.aCol); gl.vertexAttrib4f(loc.aCol, 1, 1, 1, 1); }
      }
      var tex = d.texIndex >= 0 ? textures[d.texIndex] : null;
      if (loc.aUv >= 0) {
        if (d.uv && tex) {
          gl.bindBuffer(gl.ARRAY_BUFFER, d.uv);
          gl.enableVertexAttribArray(loc.aUv);
          gl.vertexAttribPointer(loc.aUv, 2, gl.FLOAT, false, 0, 0);
        } else { gl.disableVertexAttribArray(loc.aUv); gl.vertexAttrib2f(loc.aUv, 0, 0); }
      }
      gl.uniform1f(loc.uTexOn, tex ? 1 : 0);
      if (tex) { gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); }
      if (d.points) gl.drawArrays(gl.POINTS, 0, d.count);
      else { gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, d.idx); gl.drawElements(gl.TRIANGLES, d.count, d.itype, 0); }
    });
    $('needle').setAttribute('transform', 'rotate(' + (180 - cam.bearing).toFixed(1) + ')');
  }

  // ------------------------------------------------------------------ controls
  var LABELS = { terrain: 'Terrain', buildings: 'Buildings', trees: 'Trees', points: 'Point cloud', other: 'Other' };
  var hasObjects = !!(groups.buildings || groups.trees);
  if (groups.points && hasObjects && !meta.points_on) groups.points.on = false;
  var bar = $('bar');
  order.forEach(function (g) {
    var l = document.createElement('label');
    l.innerHTML = '<input type="checkbox"' + (groups[g].on ? ' checked' : '') + '>' + (LABELS[g] || g);
    l.dataset.group = g;
    l.querySelector('input').addEventListener('change', function (ev) { groups[g].on = ev.target.checked; dirty(); });
    bar.appendChild(l);
  });
  var spinBtn = document.createElement('button');
  spinBtn.textContent = '⟳ Spin';
  spinBtn.addEventListener('click', function () { spin = !spin; spinBtn.classList.toggle('on', spin); dirty(); });
  var resetBtn = document.createElement('button');
  resetBtn.textContent = '⌂ Reset';
  resetBtn.addEventListener('click', reset);
  bar.appendChild(spinBtn);
  bar.appendChild(resetBtn);
  $('compass').addEventListener('click', function () { cam.bearing = 180; dirty(); });

  var ptrs = {};
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('pointerdown', function (e) {
    try { canvas.setPointerCapture(e.pointerId); } catch (x) { /* synthetic events */ }
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY, pan: e.button === 1 || e.button === 2 || e.shiftKey || e.ctrlKey || e.metaKey };
    canvas.classList.add('drag');
    canvas.focus();
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = ptrs[e.pointerId];
    if (!p) return;
    var ids = Object.keys(ptrs);
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (ids.length === 1) {
      if (p.pan) pan(dx, dy);
      else { cam.bearing = (cam.bearing + dx * 0.3 + 360) % 360; cam.el = clamp(cam.el + dy * 0.25, 3, 89); }
    } else if (ids.length === 2) {
      var o = ptrs[ids[0] === String(e.pointerId) ? ids[1] : ids[0]];
      var d0 = Math.hypot(p.x - o.x, p.y - o.y), d1 = Math.hypot(e.clientX - o.x, e.clientY - o.y);
      if (d0 > 1 && d1 > 1) zoom(d0 / d1);
      pan(dx / 2, dy / 2);
    }
    p.x = e.clientX;
    p.y = e.clientY;
    dirty();
  });
  function up(e) {
    delete ptrs[e.pointerId];
    if (!Object.keys(ptrs).length) canvas.classList.remove('drag');
  }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoom(Math.exp((e.deltaMode ? e.deltaY * 33 : e.deltaY) * 0.0012));
    dirty();
  }, { passive: false });
  canvas.addEventListener('dblclick', reset);
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft') cam.bearing = (cam.bearing + 355) % 360;
    else if (k === 'ArrowRight') cam.bearing = (cam.bearing + 5) % 360;
    else if (k === 'ArrowUp') cam.el = clamp(cam.el + 3, 3, 89);
    else if (k === 'ArrowDown') cam.el = clamp(cam.el - 3, 3, 89);
    else if (k === '+' || k === '=') zoom(0.85);
    else if (k === '-' || k === '_') zoom(1 / 0.85);
    else if (k === 'r' || k === 'R') { reset(); return; }
    else return;
    e.preventDefault();
    dirty();
  });
  window.addEventListener('resize', dirty);
  canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); fail('The graphics card dropped the 3D view; reload the page to show it again.'); });

  loadTextures(function () {
    fit();
    draw();
    document.body.setAttribute('data-ready', '1');
    window.geospaxScene = {
      triangles: triangles,
      points: points,
      groups: order.slice(),
      draws: draws.length,
      textures: textures.length,
      show: function (g, on) { if (groups[g]) { groups[g].on = !!on; draw(); } },
      view: function (bearing, el, distFactor) { cam.bearing = bearing; cam.el = el; if (distFactor) cam.dist = home.dist * distFactor; draw(); },
      camera: function () { return { bearing: cam.bearing, elevation: cam.el, distance: cam.dist, target: cam.t.slice() }; }
    };
  });
})();
</script>
</body>
</html>
