# GeoSpaX Surveying and cartography plugin, one of the default domain plugins. Generated by plugins/gsx/gen-manifest.mjs
# (do not edit by hand); its tools run from the shared GSX library in plugins/gsx.
plugin: geospax-surveying
version: 3.0.1
title: "Surveying and cartography"
description: "Datum and projection transformation (PNG94, AGD66, GDA, UTM), traverse adjustment by the Bowditch rule with misclosure and precision, bearings and distances, survey plan sheets with a title block, and map grids."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
default: true
run: node --no-warnings ${plugin}/../gsx/run.mjs ${tool}
tools:
  - id: "datum-transform"
    name: "Datum and projection transformation"
    summary: "Transform coordinates between datums and projections (WGS 84, UTM, PNG94/PNGMG94, AGD66/AMG66, GDA94/GDA2020, MGA, NZTM or any PROJ string), from a layer, its coordinate fields or typed coordinates."
    group: "Surveying and cartography"
    icon: earth
    params:
      - { name: "layer", label: "Points or features", kind: layer, description: "Leave empty to transform typed coordinates instead." }
      - { name: "x_field", label: "Easting or longitude field", kind: field, description: "When the coordinates are in the attribute table (for example from a CSV) rather than the map position." }
      - { name: "y_field", label: "Northing or latitude field", kind: field }
      - { name: "coordinates", label: "Typed coordinates", kind: text, default: "", description: "One \"x y\" pair per line (easting northing, or longitude latitude), used when no layer is chosen." }
      - { name: "source_crs", label: "From", kind: text, default: "EPSG:4326", description: "The system the coordinates are in. For a layer without coordinate fields this is EPSG:4326, its map position." }
      - { name: "target_crs", label: "To", kind: text, default: "auto", description: "\"auto\" chooses the WGS 84 UTM zone of the data." }
  - id: "traverse-adjust"
    name: "Traverse adjustment (Bowditch, misclosure report)"
    summary: "A traverse from a start point and its legs (bearing and distance): misclosure, precision ratio (1 in N), compass-rule (Bowditch) adjustment, adjusted coordinates and the enclosed area."
    group: "Surveying and cartography"
    icon: calc
    params:
      - { name: "legs", label: "Legs (bearing distance)", kind: text, default: "", description: "One leg per line: whole-circle bearing then distance in metres, for example \"45.3020 120.55\" (DDD.MMSS), \"45°30'20\\\" 120.55\" or \"N45°30'E 120.55\"." }
      - { name: "start_e", label: "Start easting (m)", kind: number, default: 500000 }
      - { name: "start_n", label: "Start northing (m)", kind: number, default: 9000000 }
      - { name: "close_e", label: "Closing easting (blank = back to start)", kind: text, default: "" }
      - { name: "close_n", label: "Closing northing (blank = back to start)", kind: text, default: "" }
      - { name: "bearing_format", label: "Bearing format", kind: choice, default: "dms", description: "dms: DDD.MMSS when a bearing is a single number; decimal: decimal degrees.", choices: ["dms", "decimal"] }
      - { name: "crs", label: "Coordinate system of the traverse", kind: text, default: "EPSG:32755", description: "Used to place the traverse on the map." }
      - { name: "min_ratio", label: "Required precision (1 in N)", kind: number, default: 10000, description: "The traverse fails the check when its precision is worse than this (for example 1:10 000 for cadastral work)." }
  - id: "bearing-distance"
    name: "Bearings and distances (inverse)"
    summary: "Grid bearing (DMS) and distance of every side of lines and polygons, and the area of each polygon, in a projected system: the figures for a survey plan or field book."
    group: "Surveying and cartography"
    icon: ruler
    params:
      - { name: "layer", label: "Lines or polygons", kind: layer, required: true }
      - { name: "crs", label: "Grid (projected system)", kind: text, default: "auto", description: "\"auto\" uses the WGS 84 UTM zone of the data." }
  - id: "survey-plan"
    name: "Survey plan sheet (title block)"
    summary: "An A3 survey plan of lot polygons: bearings and distances on every boundary, areas, numbered marks with a coordinate schedule, north arrow, scale bar and a title block with the surveyor's certificate."
    group: "Surveying and cartography"
    icon: print
    params:
      - { name: "lots", label: "Lot or parcel polygons", kind: layer, required: true }
      - { name: "label_field", label: "Lot label field", kind: field }
      - { name: "title", label: "Plan title", kind: text, default: "Survey plan" }
      - { name: "plan_no", label: "Plan number", kind: text, default: "" }
      - { name: "location", label: "Location", kind: text, default: "" }
      - { name: "surveyor", label: "Surveyor", kind: text, default: "" }
      - { name: "firm", label: "Firm", kind: text, default: "in4metrix" }
      - { name: "date", label: "Date (blank = today)", kind: text, default: "" }
      - { name: "crs", label: "Grid (projected system)", kind: text, default: "auto", description: "EPSG code (for example EPSG:32755, EPSG:5551 PNGMG94 zone 55, EPSG:20255 AMG66 zone 55) or a PROJ string." }
  - id: "map-grid"
    name: "Map grid and graticule (for layouts)"
    summary: "Grid lines at a set interval over a layer's extent: a latitude and longitude graticule, or an easting and northing grid in any projected system, labelled for a map layout."
    group: "Surveying and cartography"
    icon: grid
    params:
      - { name: "layer", label: "Extent of", kind: layer, required: true }
      - { name: "crs", label: "Grid system", kind: text, default: "EPSG:4326", description: "EPSG:4326 for a graticule, a projected system (or \"auto\" for UTM) for a grid." }
      - { name: "interval", label: "Interval (degrees or metres)", kind: number, default: 0, description: "0 chooses about eight lines across." }
