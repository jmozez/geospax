# GeoSpaX Aeronautical plugin, one of the default domain plugins. Generated by plugins/gsx/gen-manifest.mjs
# (do not edit by hand); its tools run from the shared GSX library in plugins/gsx.
plugin: geospax-aviation
version: 3.0.1
title: "Aeronautical"
description: "ICAO Annex 14 obstacle limitation surfaces for a runway and the obstacles that penetrate them, with terrain profiles."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
default: true
run: node --no-warnings ${plugin}/../gsx/run.mjs ${tool}
tools:
  - id: "ols-surfaces"
    name: "Obstacle limitation surfaces (airports)"
    summary: "ICAO Annex 14 approach, inner horizontal and conical surfaces for a runway by code number, and the obstacles (towers, trees, buildings) that penetrate them, by how much."
    group: "Aeronautical"
    icon: chart
    params:
      - { name: "runway", label: "Runway centre line (threshold to threshold)", kind: layer, required: true }
      - { name: "elevation_m", label: "Aerodrome elevation (m AMSL)", kind: number, default: 0 }
      - { name: "code", label: "Runway code number", kind: choice, default: "3", description: "From the runway length: 1 under 800 m, 2 800 to 1199 m, 3 1200 to 1799 m, 4 1800 m and over.", choices: ["3", "4", "2", "1"] }
      - { name: "obstacles", label: "Obstacles (optional)", kind: layer }
      - { name: "top_field", label: "Obstacle top elevation field (m AMSL)", kind: field }
  - id: "elevation-profile"
    name: "Elevation profile"
    summary: "The terrain along a line over a DEM (each line its own profile), or through points that carry an elevation field (in their order, grouped by a field such as a transect): the chart, length, climb, descent and steepest slope."
    group: "Aeronautical"
    icon: chart
    params:
      - { name: "layer", label: "Lines or points", kind: layer, required: true }
      - { name: "dem", label: "Elevation raster (DEM)", kind: raster, description: "For lines; points can use their own elevation field instead" }
      - { name: "elevation_field", label: "Elevation field (points)", kind: field, description: "e.g. elevation_m; used when no DEM is given" }
      - { name: "group_field", label: "One profile per (points)", kind: field, description: "e.g. transect" }
      - { name: "order_field", label: "Sort points by", kind: field, description: "e.g. site or distance along the transect; empty = the order in the layer" }
      - { name: "spacing_m", label: "Sample every (m)", kind: number, default: 0, description: "0 = half the DEM cell size" }
  - id: "slope-zones"
    name: "Slope zones"
    summary: "Horn slope from a DEM in three zones (gentle, moderate, steep) with their areas; breaks in degrees."
    group: "Aeronautical"
    icon: image
    params:
      - { name: "dem", label: "Elevation (DEM)", kind: raster, required: true, description: "Metres; geographic or projected." }
      - { name: "breaks", label: "Breaks (°)", kind: text, default: "8, 20", description: "Two slopes that split gentle | moderate | steep." }
