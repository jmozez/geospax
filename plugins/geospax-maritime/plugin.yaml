# GeoSpaX Maritime plugin, one of the default domain plugins. Generated by plugins/gsx/gen-manifest.mjs
# (do not edit by hand); its tools run from the shared GSX library in plugins/gsx.
plugin: geospax-maritime
version: 3.0.1
title: "Maritime"
description: "Vessel track density from AIS, loitering and AIS gaps (dark vessels) in a zone of interest, and hot spots."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
default: true
run: node --no-warnings ${plugin}/../gsx/run.mjs ${tool}
tools:
  - id: "ais-density"
    name: "Vessel track density (AIS)"
    summary: "Square cells counting AIS position reports and distinct vessels: shipping lanes, fishing grounds and anchorages."
    group: "Maritime"
    icon: grid
    params:
      - { name: "pings", label: "AIS positions (points)", kind: layer, required: true }
      - { name: "vessel_field", label: "Vessel id field (MMSI)", kind: field }
      - { name: "cell_m", label: "Cell size (m)", kind: number, default: 1000 }
  - id: "ais-loitering"
    name: "Vessel loitering and AIS gaps"
    summary: "Vessels that stay within a small radius for a long time (loitering, possible transhipment or illegal fishing) and gaps in their AIS reports (transponder switched off), from time-stamped positions."
    group: "Maritime"
    icon: alert
    params:
      - { name: "pings", label: "AIS positions (points)", kind: layer, required: true }
      - { name: "vessel_field", label: "Vessel id field (MMSI)", kind: field, required: true }
      - { name: "time_field", label: "Time field", kind: field, required: true }
      - { name: "radius_m", label: "Loitering radius (m)", kind: number, default: 1000 }
      - { name: "min_hours", label: "Loitering for at least (hours)", kind: number, default: 2 }
      - { name: "gap_hours", label: "Report gap of at least (hours)", kind: number, default: 6 }
      - { name: "zone", label: "Zone of interest (optional: only events inside)", kind: layer }
  - id: "hotspot-grid"
    name: "Weighted hotspot grid"
    summary: "Hexagon or square grid scored by weighted counts, density or presence of up to three layers (descriptive, not Gi*)."
    group: "Maritime"
    icon: grid
    params:
      - { name: "layer", label: "Layer 1", kind: layer, required: true }
      - { name: "weight", label: "Weight 1", kind: number, default: 1 }
      - { name: "layer2", label: "Layer 2", kind: layer }
      - { name: "weight2", label: "Weight 2", kind: number, default: 1 }
      - { name: "layer3", label: "Layer 3", kind: layer }
      - { name: "weight3", label: "Weight 3", kind: number, default: 1 }
      - { name: "cell_km", label: "Cell size (km)", kind: number, required: true, default: 5 }
      - { name: "shape", label: "Shape", kind: choice, default: "hex", choices: ["hex", "square"] }
      - { name: "score", label: "Score", kind: choice, default: "count", choices: ["count", "density", "presence"] }
  - id: "dbscan"
    name: "DBSCAN clusters"
    summary: "Density-based clusters of up to 2,000 points (haversine distance); noise stays as cluster −1."
    group: "Maritime"
    icon: hotspot
    params:
      - { name: "points", label: "Points", kind: layer, required: true }
      - { name: "min_points", label: "Minimum points", kind: number, default: 4 }
      - { name: "epsilon_m", label: "Radius (m)", kind: number, description: "Empty: from the median nearest-neighbour distance × multiplier." }
      - { name: "multiplier", label: "Automatic radius × ", kind: number, default: 1.5 }
      - { name: "land_dem", label: "Land mask raster (bathymetry / topography)", kind: raster, description: "Never guessed: pick e.g. GEBCO; records with no cell at or below 0 m within the coastal tolerance count as on land." }
      - { name: "land_polygons", label: "Land mask: land polygons", kind: layer, description: "Optional, e.g. OSM land polygons or Natural Earth 10 m land." }
      - { name: "coastal_m", label: "Coastal tolerance (m)", kind: number, default: 1000, description: "A record is kept as marine if any sea cell lies within this distance (allows for coarse coastlines)." }
      - { name: "drop_on_land", label: "Drop records on land before clustering", kind: bool, default: true, description: "Only used when a land mask is given." }
