# GeoSpaX Urban planning plugin, one of the default domain plugins. Generated by plugins/gsx/gen-manifest.mjs
# (do not edit by hand); its tools run from the shared GSX library in plugins/gsx.
plugin: geospax-urban
version: 3.0.1
title: "Urban planning"
description: "Zoning summaries, building and population density, green space access, service areas and asset registers for cities and towns."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
default: true
run: node --no-warnings ${plugin}/../gsx/run.mjs ${tool}
tools:
  - id: "zoning-summary"
    name: "Zoning summary"
    summary: "Area and share of each zone (land-use zoning or planning scheme), and the count and density of buildings, parcels or households in each."
    group: "Urban planning"
    icon: mapOutline
    params:
      - { name: "zones", label: "Zones (polygons)", kind: layer, required: true }
      - { name: "zone_field", label: "Zone field", kind: field, required: true }
      - { name: "features", label: "Buildings or households (optional)", kind: layer }
  - id: "density-grid"
    name: "Building and population density"
    summary: "Square cells counting buildings, households or people (from a population field) per hectare: settlement density for city and town planning."
    group: "Urban planning"
    icon: grid
    params:
      - { name: "points", label: "Buildings or households (points)", kind: layer, required: true }
      - { name: "weight_field", label: "Population field (optional)", kind: field }
      - { name: "cell_m", label: "Cell size (m)", kind: number, default: 100 }
  - id: "green-access"
    name: "Green space access"
    summary: "Distance from each home or building to the nearest park or green space of a minimum size, and the share within walking distance (for example 400 m, about 5 minutes)."
    group: "Urban planning"
    icon: d-environment
    params:
      - { name: "homes", label: "Homes or buildings (points)", kind: layer, required: true }
      - { name: "parks", label: "Parks and green spaces (polygons)", kind: layer, required: true }
      - { name: "walk_m", label: "Walking distance (m)", kind: number, default: 400 }
      - { name: "min_ha", label: "Smallest park counted (ha)", kind: number, default: 0.5 }
      - { name: "weight_field", label: "Population field (optional)", kind: field }
  - id: "service-area"
    name: "Service areas (drive time or distance)"
    summary: "The parts of a road network reachable from depots, clinics or other facilities within time or distance bands, and the nearest facility for each demand point."
    group: "Urban planning"
    icon: road
    params:
      - { name: "network", label: "Road network (lines)", kind: layer, required: true }
      - { name: "facilities", label: "Facilities (points)", kind: layer, required: true }
      - { name: "bands", label: "Bands (minutes, or metres without a speed)", kind: text, default: "10, 20, 30" }
      - { name: "speed_field", label: "Speed field (km/h)", kind: field }
      - { name: "speed_kmh", label: "Default speed (km/h, 0 = distance)", kind: number, default: 40 }
      - { name: "demand", label: "Demand points (optional)", kind: layer }
  - id: "suitability"
    name: "Weighted suitability (WLC)"
    summary: "Weighted linear combination of numeric fields, each rescaled 0–1; optional constraint field forces zero."
    group: "Urban planning"
    icon: chart
    params:
      - { name: "layer", label: "Features", kind: layer, required: true }
      - { name: "criteria", label: "Criteria", kind: text, required: true, description: "field:weight, … — add :- when lower is better, e.g. \"forest_pct:3, road_km:1:-\"" }
      - { name: "constraint", label: "Constraint field", kind: field, description: "Features where this is true score zero." }
  - id: "asset-register"
    name: "Asset register (age, inspections, risk)"
    summary: "For each asset (poles, pumps, bridges, culverts, pipes): age and remaining life, the next inspection and whether it is overdue, and a risk score from condition and criticality."
    group: "Urban planning"
    icon: database
    params:
      - { name: "assets", label: "Assets", kind: layer, required: true }
      - { name: "installed_field", label: "Installed date or year field", kind: field }
      - { name: "life_years", label: "Design life (years)", kind: number, default: 40 }
      - { name: "inspected_field", label: "Last inspection date field", kind: field }
      - { name: "interval_months", label: "Inspection interval (months)", kind: number, default: 12 }
      - { name: "condition_field", label: "Condition field (1 very good to 5 very poor)", kind: field }
      - { name: "criticality_field", label: "Criticality field (1 to 5)", kind: field }
      - { name: "as_of", label: "As of (date, blank = today)", kind: text, default: "" }
