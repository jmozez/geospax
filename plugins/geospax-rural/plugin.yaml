# GeoSpaX Rural planning plugin, one of the default domain plugins. Generated by plugins/gsx/gen-manifest.mjs
# (do not edit by hand); its tools run from the shared GSX library in plugins/gsx.
plugin: geospax-rural
version: 3.0.1
title: "Rural planning"
description: "Access to clinics, schools and markets, land suitability, slope zones, distance decay and zoning for rural districts."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
default: true
run: node --no-warnings ${plugin}/../gsx/run.mjs ${tool}
tools:
  - id: "service-access"
    name: "Access to services (clinics, schools, markets)"
    summary: "Travel distance or time from each village or household to the nearest service, over roads and tracks or in straight lines, with the population beyond each threshold."
    group: "Rural planning"
    icon: home
    params:
      - { name: "settlements", label: "Villages or households (points)", kind: layer, required: true }
      - { name: "services", label: "Services (points)", kind: layer, required: true }
      - { name: "network", label: "Roads and tracks (optional)", kind: layer }
      - { name: "speed_field", label: "Speed field (km/h)", kind: field }
      - { name: "speed_kmh", label: "Default speed (km/h, 0 = distance)", kind: number, default: 0 }
      - { name: "pop_field", label: "Population field (optional)", kind: field }
      - { name: "thresholds", label: "Thresholds (km or minutes)", kind: text, default: "5, 10, 20" }
  - id: "suitability"
    name: "Weighted suitability (WLC)"
    summary: "Weighted linear combination of numeric fields, each rescaled 0–1; optional constraint field forces zero."
    group: "Rural planning"
    icon: chart
    params:
      - { name: "layer", label: "Features", kind: layer, required: true }
      - { name: "criteria", label: "Criteria", kind: text, required: true, description: "field:weight, … — add :- when lower is better, e.g. \"forest_pct:3, road_km:1:-\"" }
      - { name: "constraint", label: "Constraint field", kind: field, description: "Features where this is true score zero." }
  - id: "slope-zones"
    name: "Slope zones"
    summary: "Horn slope from a DEM in three zones (gentle, moderate, steep) with their areas; breaks in degrees."
    group: "Rural planning"
    icon: image
    params:
      - { name: "dem", label: "Elevation (DEM)", kind: raster, required: true, description: "Metres; geographic or projected." }
      - { name: "breaks", label: "Breaks (°)", kind: text, default: "8, 20", description: "Two slopes that split gentle | moderate | steep." }
  - id: "distance-decay"
    name: "Distance-decay suitability"
    summary: "Score features by a distance field with exponential decay: 1 at zero distance, 0.5 at the half-life."
    group: "Rural planning"
    icon: chart
    params:
      - { name: "layer", label: "Features", kind: layer, required: true }
      - { name: "field", label: "Distance field (m)", kind: field, required: true }
      - { name: "half_life", label: "Half-life (m)", kind: number, required: true, default: 1000 }
  - id: "zoning-summary"
    name: "Zoning summary"
    summary: "Area and share of each zone (land-use zoning or planning scheme), and the count and density of buildings, parcels or households in each."
    group: "Rural planning"
    icon: mapOutline
    params:
      - { name: "zones", label: "Zones (polygons)", kind: layer, required: true }
      - { name: "zone_field", label: "Zone field", kind: field, required: true }
      - { name: "features", label: "Buildings or households (optional)", kind: layer }
  - id: "density-grid"
    name: "Building and population density"
    summary: "Square cells counting buildings, households or people (from a population field) per hectare: settlement density for city and town planning."
    group: "Rural planning"
    icon: grid
    params:
      - { name: "points", label: "Buildings or households (points)", kind: layer, required: true }
      - { name: "weight_field", label: "Population field (optional)", kind: field }
      - { name: "cell_m", label: "Cell size (m)", kind: number, default: 100 }
