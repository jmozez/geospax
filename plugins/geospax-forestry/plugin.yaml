# GeoSpaX Forestry plugin, one of the default domain plugins. Generated by plugins/gsx/gen-manifest.mjs
# (do not edit by hand); its tools run from the shared GSX library in plugins/gsx.
plugin: geospax-forestry
version: 3.0.1
title: "Forestry"
description: "Forest and burn extent, landscape metrics, connectivity, loss and gain, forest protection gaps, harvest coupe net areas, and logging road routes and buffers."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
default: true
run: node --no-warnings ${plugin}/../gsx/run.mjs ${tool}
tools:
  - id: "spectral-index"
    name: "Spectral index and extent (Otsu)"
    summary: "NDVI, NDWI, NDBI, NBR or any band pair from a multiband image, with an automatic Otsu threshold and the area above it."
    group: "Forestry"
    icon: satellite
    params:
      - { name: "image", label: "Image", kind: raster, required: true, description: "A multiband raster (Sentinel-2, Landsat, drone …)." }
      - { name: "index", label: "Index", kind: choice, default: "NDVI", description: "Formula (A − B) / (A + B); the bands below say which band is A and which is B.", choices: ["NDVI", "NDWI", "NDBI", "NBR", "CUSTOM"] }
      - { name: "band_a", label: "Band A", kind: number, default: 4, description: "NDVI/NDWI/NBR: near infrared; NDBI: SWIR. 1 = first band." }
      - { name: "band_b", label: "Band B", kind: number, default: 3, description: "NDVI: red; NDWI/NDBI: NIR or SWIR; NBR: SWIR2." }
      - { name: "threshold", label: "Threshold (blank = Otsu)", kind: number, description: "Cells at or above it count as the extent (vegetation, water, built-up, burnt …)." }
  - id: "fragmentation"
    name: "Fragmentation and patch metrics"
    summary: "FRAGSTATS-style metrics (NP, CA, LPI, TE, ED, MSI, core area, CAI, ENN) and core-area polygons."
    group: "Forestry"
    icon: layers
    params:
      - { name: "patches", label: "Patches", kind: layer, required: true }
      - { name: "edge_m", label: "Core edge depth (m)", kind: number, default: 100 }
      - { name: "area", label: "Area method", kind: choice, default: "equalarea", description: "Equal-area (auto-centred LAEA, hectares) or spherical.", choices: ["equalarea", "spherical"] }
      - { name: "explode", label: "Each multipolygon part is a patch", kind: bool, default: true }
  - id: "connectivity"
    name: "Patch connectivity"
    summary: "Links patches closer than a threshold distance and reports the connected components."
    group: "Forestry"
    icon: hotspot
    params:
      - { name: "patches", label: "Patches", kind: layer, required: true }
      - { name: "threshold_m", label: "Link threshold (m)", kind: number, required: true, default: 500 }
  - id: "raster-change"
    name: "Raster change (two dates)"
    summary: "After − before for one band of two images or index rasters, with Otsu thresholds for gain and loss and their areas."
    group: "Forestry"
    icon: clock
    params:
      - { name: "before", label: "Before", kind: raster, required: true, description: "The earlier raster (an NDVI from Spectral index, a DEM, a classification score …)." }
      - { name: "after", label: "After", kind: raster, required: true, description: "The later raster; it is resampled onto the earlier one’s grid." }
      - { name: "band", label: "Band", kind: number, default: 1 }
  - id: "change"
    name: "Two-date change (loss, gain, persistence)"
    summary: "Compares two polygon layers of the same thing (forest, wetland, land cover) and reports loss, gain and the annual rate."
    group: "Forestry"
    icon: clock
    params:
      - { name: "t1", label: "Earlier extent", kind: layer, required: true }
      - { name: "t2", label: "Later extent", kind: layer, required: true }
      - { name: "year1", label: "Earlier year", kind: number }
      - { name: "year2", label: "Later year", kind: number }
      - { name: "area", label: "Area method", kind: choice, default: "equalarea", description: "Equal-area (auto-centred LAEA, hectares) or spherical.", choices: ["equalarea", "spherical"] }
  - id: "protection-gap"
    name: "Protection gap"
    summary: "How much of a habitat or range lies inside protected areas, and the unprotected gap, in hectares."
    group: "Forestry"
    icon: globe
    params:
      - { name: "habitat", label: "Habitat / range", kind: layer, required: true }
      - { name: "protected", label: "Protected areas", kind: layer, required: true }
      - { name: "area", label: "Area method", kind: choice, default: "equalarea", description: "Equal-area (auto-centred LAEA, hectares) or spherical.", choices: ["equalarea", "spherical"] }
  - id: "harvest-coupes"
    name: "Harvest coupe net area (stream buffers, steep slopes)"
    summary: "Gross and net harvestable area of each logging coupe after stream and river buffers and slopes too steep to log are excluded, with the excluded areas."
    group: "Forestry"
    icon: d-forestry
    params:
      - { name: "coupes", label: "Coupes (polygons)", kind: layer, required: true }
      - { name: "streams", label: "Streams and rivers (lines, optional)", kind: layer }
      - { name: "buffer_m", label: "Stream buffer (m each side)", kind: number, default: 50, description: "The PNG Logging Code of Practice uses 50 m for major rivers and 10 m for streams; use the widest that applies." }
      - { name: "dem", label: "DEM (optional, for slope)", kind: raster }
      - { name: "max_slope_deg", label: "Steepest loggable slope (°)", kind: number, default: 30 }
      - { name: "step_m", label: "Sample spacing (m)", kind: number, default: 10 }
  - id: "route-suitability"
    name: "Least-cost route (pipelines, haul and logging roads)"
    summary: "The cheapest route between two points across a DEM (grade-limited) or a cost surface, avoiding no-go areas: for pipeline, haul road and logging road alignments, with length and grades."
    group: "Forestry"
    icon: roadCentre
    params:
      - { name: "surface", label: "DEM or cost surface", kind: raster, required: true }
      - { name: "ends", label: "Start and end (points: first and last)", kind: layer, required: true }
      - { name: "surface_kind", label: "The surface is", kind: choice, default: "dem", description: "dem: cost grows with slope and cells steeper than the maximum grade are impassable; cost: the raster values are the cost per metre.", choices: ["dem", "cost"] }
      - { name: "max_grade_deg", label: "Maximum grade (°)", kind: number, default: 12, description: "For a DEM: cells steeper than this are impassable (haul roads are often 6 to 10 %, about 3.5 to 5.7°)." }
      - { name: "avoid", label: "No-go areas (optional)", kind: layer, description: "Protected areas, villages, water bodies: never crossed." }
  - id: "corridor-zones"
    name: "Corridor and clearance zones (power lines, pipelines, roads)"
    summary: "Nested zones either side of lines (easement, clearance, consultation …) as polygons with their areas, and every feature of a second layer that falls inside a zone (encroachments), with its distance."
    group: "Forestry"
    icon: tBuffer
    params:
      - { name: "lines", label: "Lines (power lines, pipelines, roads)", kind: layer, required: true }
      - { name: "zones", label: "Zones (name:half-width in metres)", kind: text, default: "easement:20, clearance:40, consultation:100", description: "Half-widths either side of the centre line, for example easement:20, clearance:40." }
      - { name: "features", label: "Features to check (buildings, trees, wells …)", kind: layer }
