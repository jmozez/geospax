# GSX tool library for GeoSpaX 3. Generated by gen-manifest.mjs from src/ (do not edit by hand).
# The analysis comes from GeoSpaX 2.0 (jm0535/GeoSpaX) and 1.4.2 (jm0535/map-kit). The app shows it
# through the twelve geospax-<domain> plugins; recipes, the API and MCP call it as gsx/<tool>.
plugin: gsx
version: 3.0.1
title: GSX tool library
description: "19 conservation, landscape and biodiversity tools shared by the twelve domain plugins. Runs on Node, offline."
author: in4metrix (GeoSpaX 1.4.2 and 2.0) · plugin by GeoSpaX
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
library: true
run: node --no-warnings ${plugin}/run.mjs ${tool}
tools:
  - id: "overlay"
    name: "Polygon overlay"
    summary: "Intersect, erase (difference) or union two polygon layers; areas in hectares."
    group: "Analysis › Overlay"
    icon: layers
    params:
      - { name: "a", label: "Layer A", kind: layer, required: true }
      - { name: "b", label: "Layer B", kind: layer, required: true }
      - { name: "operation", label: "Operation", kind: choice, default: "intersect", choices: ["intersect", "difference", "union"] }
  - id: "suitability"
    name: "Weighted suitability (WLC)"
    summary: "Weighted linear combination of numeric fields, each rescaled 0–1; optional constraint field forces zero."
    group: "Conservation Planning"
    icon: chart
    params:
      - { name: "layer", label: "Features", kind: layer, required: true }
      - { name: "criteria", label: "Criteria", kind: text, required: true, description: "field:weight, … — add :- when lower is better, e.g. \"forest_pct:3, road_km:1:-\"" }
      - { name: "constraint", label: "Constraint field", kind: field, description: "Features where this is true score zero." }
  - id: "distance-decay"
    name: "Distance-decay suitability"
    summary: "Score features by a distance field with exponential decay: 1 at zero distance, 0.5 at the half-life."
    group: "Conservation Planning"
    icon: chart
    params:
      - { name: "layer", label: "Features", kind: layer, required: true }
      - { name: "field", label: "Distance field (m)", kind: field, required: true }
      - { name: "half_life", label: "Half-life (m)", kind: number, required: true, default: 1000 }
  - id: "priority-sites"
    name: "Unprotected priority sites"
    summary: "High-scoring habitat points that fall outside every protected area."
    group: "Conservation Planning"
    icon: pin
    params:
      - { name: "habitat", label: "Habitat points", kind: layer, required: true }
      - { name: "protected", label: "Protected areas", kind: layer, required: true }
      - { name: "score", label: "Score field", kind: field, required: true }
      - { name: "min_score", label: "Minimum score", kind: number, default: 1 }
  - id: "protection-gap"
    name: "Protection gap"
    summary: "How much of a habitat or range lies inside protected areas, and the unprotected gap, in hectares."
    group: "Conservation Planning"
    icon: globe
    params:
      - { name: "habitat", label: "Habitat / range", kind: layer, required: true }
      - { name: "protected", label: "Protected areas", kind: layer, required: true }
      - { name: "area", label: "Area method", kind: choice, default: "equalarea", description: "Equal-area (auto-centred LAEA, hectares) or spherical.", choices: ["equalarea", "spherical"] }
  - id: "representation"
    name: "Minimum-cost representation (SCP)"
    summary: "Cheapest set of planning units that meets a target for each feature (exact for ≤ 28 units, greedy above)."
    group: "Conservation Planning"
    icon: grid
    params:
      - { name: "units", label: "Planning units", kind: layer, required: true }
      - { name: "cost", label: "Cost field", kind: field, required: true }
      - { name: "targets", label: "Targets", kind: text, required: true, description: "field:target, … — e.g. \"frog_ha:50, forest_ha:200\"" }
  - id: "hotspot-grid"
    name: "Weighted hotspot grid"
    summary: "Hexagon or square grid scored by weighted counts, density or presence of up to three layers (descriptive, not Gi*)."
    group: "Conservation Planning"
    icon: grid
    params:
      - { name: "layer", label: "Layer 1", kind: layer, required: true }
      - { name: "weight", label: "Weight 1", kind: number, default: 1 }
      - { name: "layer2", label: "Layer 2", kind: layer }
      - { name: "weight2", label: "Weight 2", kind: number, default: 1 }
      - { name: "layer3", label: "Layer 3", kind: layer }
      - { name: "weight3", label: "Weight 3", kind: number, default: 1 }
      - { name: "cell_km", label: "Cell size (km)", kind: number, required: true, default: 5 }
      - { name: "shape", label: "Shape", kind: choice, default: "hex", choices: ["hex", "square"] }
      - { name: "score", label: "Score", kind: choice, default: "count", choices: ["count", "density", "presence"] }
  - id: "fragmentation"
    name: "Fragmentation and patch metrics"
    summary: "FRAGSTATS-style metrics (NP, CA, LPI, TE, ED, MSI, core area, CAI, ENN) and core-area polygons."
    group: "Landscape Ecology"
    icon: layers
    params:
      - { name: "patches", label: "Patches", kind: layer, required: true }
      - { name: "edge_m", label: "Core edge depth (m)", kind: number, default: 100 }
      - { name: "area", label: "Area method", kind: choice, default: "equalarea", description: "Equal-area (auto-centred LAEA, hectares) or spherical.", choices: ["equalarea", "spherical"] }
      - { name: "explode", label: "Each multipolygon part is a patch", kind: bool, default: true }
  - id: "connectivity"
    name: "Patch connectivity"
    summary: "Links patches closer than a threshold distance and reports the connected components."
    group: "Landscape Ecology"
    icon: hotspot
    params:
      - { name: "patches", label: "Patches", kind: layer, required: true }
      - { name: "threshold_m", label: "Link threshold (m)", kind: number, required: true, default: 500 }
  - id: "change"
    name: "Two-date change (loss, gain, persistence)"
    summary: "Compares two polygon layers of the same thing (forest, wetland, land cover) and reports loss, gain and the annual rate."
    group: "Landscape Ecology"
    icon: clock
    params:
      - { name: "t1", label: "Earlier extent", kind: layer, required: true }
      - { name: "t2", label: "Later extent", kind: layer, required: true }
      - { name: "year1", label: "Earlier year", kind: number }
      - { name: "year2", label: "Later year", kind: number }
      - { name: "area", label: "Area method", kind: choice, default: "equalarea", description: "Equal-area (auto-centred LAEA, hectares) or spherical.", choices: ["equalarea", "spherical"] }
  - id: "dbscan"
    name: "DBSCAN clusters"
    summary: "Density-based clusters of up to 2,000 points (haversine distance); noise stays as cluster −1."
    group: "Spatial Statistics › Point patterns"
    icon: hotspot
    params:
      - { name: "points", label: "Points", kind: layer, required: true }
      - { name: "min_points", label: "Minimum points", kind: number, default: 4 }
      - { name: "epsilon_m", label: "Radius (m)", kind: number, description: "Empty: from the median nearest-neighbour distance × multiplier." }
      - { name: "multiplier", label: "Automatic radius × ", kind: number, default: 1.5 }
  - id: "nearest-neighbour"
    name: "Occurrence pattern (Clark–Evans)"
    summary: "Nearest-neighbour ratio R and z-score: clustered, random-like or dispersed."
    group: "Spatial Statistics › Point patterns"
    icon: hotspot
    params:
      - { name: "points", label: "Points", kind: layer, required: true }
  - id: "diversity"
    name: "Richness and diversity"
    summary: "Species richness, Shannon H′, Simpson and evenness of an occurrence layer, overall and per area."
    group: "Biodiversity"
    icon: chart
    params:
      - { name: "occurrences", label: "Occurrences", kind: layer, required: true }
      - { name: "species", label: "Species field", kind: field, required: true }
      - { name: "areas", label: "Per area (optional)", kind: layer, description: "Polygons; each gets richness, Shannon and Simpson of the points inside." }
  - id: "spectral-index"
    name: "Spectral index and extent (Otsu)"
    summary: "NDVI, NDWI, NDBI, NBR or any band pair from a multiband image, with an automatic Otsu threshold and the area above it."
    group: "Image Analysis › Spectral indices"
    icon: satellite
    params:
      - { name: "image", label: "Image", kind: raster, required: true, description: "A multiband raster (Sentinel-2, Landsat, drone …)." }
      - { name: "index", label: "Index", kind: choice, default: "NDVI", description: "Formula (A − B) / (A + B); the bands below say which band is A and which is B.", choices: ["NDVI", "NDWI", "NDBI", "NBR", "CUSTOM"] }
      - { name: "band_a", label: "Band A", kind: number, default: 4, description: "NDVI/NDWI/NBR: near infrared; NDBI: SWIR. 1 = first band." }
      - { name: "band_b", label: "Band B", kind: number, default: 3, description: "NDVI: red; NDWI/NDBI: NIR or SWIR; NBR: SWIR2." }
      - { name: "threshold", label: "Threshold (blank = Otsu)", kind: number, description: "Cells at or above it count as the extent (vegetation, water, built-up, burnt …)." }
  - id: "raster-change"
    name: "Raster change (two dates)"
    summary: "After − before for one band of two images or index rasters, with Otsu thresholds for gain and loss and their areas."
    group: "Image Analysis › Change detection"
    icon: clock
    params:
      - { name: "before", label: "Before", kind: raster, required: true, description: "The earlier raster (an NDVI from Spectral index, a DEM, a classification score …)." }
      - { name: "after", label: "After", kind: raster, required: true, description: "The later raster; it is resampled onto the earlier one’s grid." }
      - { name: "band", label: "Band", kind: number, default: 1 }
  - id: "slope-zones"
    name: "Slope zones"
    summary: "Horn slope from a DEM in three zones (gentle, moderate, steep) with their areas; breaks in degrees."
    group: "Terrain › Slope zones"
    icon: image
    params:
      - { name: "dem", label: "Elevation (DEM)", kind: raster, required: true, description: "Metres; geographic or projected." }
      - { name: "breaks", label: "Breaks (°)", kind: text, default: "8, 20", description: "Two slopes that split gentle | moderate | steep." }
  - id: "sdm"
    name: "Species distribution model"
    summary: "BIOCLIM, Mahalanobis or presence-background logistic suitability from occurrences and environmental rasters, with spatially blocked cross-validation (AUC, TSS, Boyce)."
    group: "Species Distribution"
    icon: pin
    params:
      - { name: "occurrences", label: "Occurrences", kind: layer, required: true, description: "Presence points (e.g. Data › Species from GBIF)." }
      - { name: "covariates", label: "Environmental rasters", kind: rasters, required: true, description: "One or more rasters (all their bands are used), e.g. WorldClim bioclim from Data › Climate." }
      - { name: "method", label: "Method", kind: choice, default: "logistic", description: "logistic: presence vs background (a linear MaxEnt-like model); bioclim: percentile envelope; mahalanobis: distance to the presence mean.", choices: ["logistic", "bioclim", "mahalanobis"] }
      - { name: "background", label: "Background points", kind: number, default: 5000, description: "Random cells for presence-background fitting and evaluation." }
      - { name: "folds", label: "Cross-validation folds", kind: number, default: 5 }
      - { name: "future", label: "Future rasters (optional)", kind: rasters, description: "The same variables for a future climate (e.g. Data › Future climate, CMIP6), in the same order: adds future suitability and range gain / loss." }
      - { name: "block_deg", label: "Block size (°, blank = automatic)", kind: number, description: "Spatial blocks for cross-validation, in degrees; automatic: a sixth of the study area’s width, made smaller until the presences fall in at least twice as many blocks as folds." }
  - id: "local-moran"
    name: "Local Moran's I (clusters and outliers, LISA)"
    summary: "Where high values sit among high values (hot spots), low among low, and where a feature differs from its neighbours (outliers); with the global Moran's I and its scatterplot. As ArcGIS Pro's Cluster and Outlier Analysis and GeoDa's LISA."
    group: "Spatial Statistics › Clusters and outliers"
    icon: hotspot
    params:
      - { name: "layer", label: "Layer", kind: layer, required: true }
      - { name: "field", label: "Numeric field", kind: field, required: true, description: "The value to test, e.g. species richness, count, rate" }
      - { name: "neighbours", label: "Neighbours", kind: choice, default: "auto", description: "auto: polygons that touch (queen contiguity), points: the 8 nearest", choices: ["auto", "contiguity", "k-nearest", "distance"] }
      - { name: "k", label: "k (nearest)", kind: number, default: 8 }
      - { name: "distance_km", label: "Distance band (km)", kind: number, default: 0, description: "For \"distance\": neighbours within this distance" }
      - { name: "permutations", label: "Permutations", kind: number, default: 999 }
      - { name: "alpha", label: "Significance level", kind: number, default: 0.05 }
      - { name: "fdr", label: "False discovery rate correction", kind: bool, default: false, description: "Benjamini–Hochberg over all features (fewer, safer clusters)" }
      - { name: "seed", label: "Random seed", kind: number, default: 12345, description: "Same seed, same p-values" }
  - id: "elevation-profile"
    name: "Elevation profile"
    summary: "The terrain along a line over a DEM (each line its own profile), or through points that carry an elevation field (in their order, grouped by a field such as a transect): the chart, length, climb, descent and steepest slope."
    group: "Terrain › Profiles"
    icon: chart
    params:
      - { name: "layer", label: "Lines or points", kind: layer, required: true }
      - { name: "dem", label: "Elevation raster (DEM)", kind: raster, description: "For lines; points can use their own elevation field instead" }
      - { name: "elevation_field", label: "Elevation field (points)", kind: field, description: "e.g. elevation_m; used when no DEM is given" }
      - { name: "group_field", label: "One profile per (points)", kind: field, description: "e.g. transect" }
      - { name: "order_field", label: "Sort points by", kind: field, description: "e.g. site or distance along the transect; empty = the order in the layer" }
      - { name: "spacing_m", label: "Sample every (m)", kind: number, default: 0, description: "0 = half the DEM cell size" }
