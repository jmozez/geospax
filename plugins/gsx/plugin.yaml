# GSX tool library for GeoSpaX 3. Generated by gen-manifest.mjs from src/ (do not edit by hand).
# The analysis is by in4metrix (MIT). The app shows it
# through the twelve geospax-<domain> plugins; recipes, the API and MCP call it as gsx/<tool>.
plugin: gsx
version: 3.0.1
title: GSX tool library
description: "31 conservation, landscape and biodiversity tools shared by the twelve domain plugins. Runs on Node, offline."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
library: true
run: node --no-warnings ${plugin}/run.mjs ${tool}
tools:
  - id: "overlay"
    name: "Polygon overlay"
    summary: "Intersect, erase (difference) or union two polygon layers; areas in hectares."
    group: "Analysis › Overlay"
    icon: layers
    params:
      - { name: "a", label: "Layer A", kind: layer, required: true }
      - { name: "b", label: "Layer B", kind: layer, required: true }
      - { name: "operation", label: "Operation", kind: choice, default: "intersect", choices: ["intersect", "difference", "union"] }
  - id: "suitability"
    name: "Weighted suitability (WLC)"
    summary: "Weighted linear combination of numeric fields, each rescaled 0–1; optional constraint field forces zero."
    group: "Conservation Planning"
    icon: chart
    params:
      - { name: "layer", label: "Features", kind: layer, required: true }
      - { name: "criteria", label: "Criteria", kind: text, required: true, description: "field:weight, … — add :- when lower is better, e.g. \"forest_pct:3, road_km:1:-\"" }
      - { name: "constraint", label: "Constraint field", kind: field, description: "Features where this is true score zero." }
  - id: "distance-decay"
    name: "Distance-decay suitability"
    summary: "Score features by a distance field with exponential decay: 1 at zero distance, 0.5 at the half-life."
    group: "Conservation Planning"
    icon: chart
    params:
      - { name: "layer", label: "Features", kind: layer, required: true }
      - { name: "field", label: "Distance field (m)", kind: field, required: true }
      - { name: "half_life", label: "Half-life (m)", kind: number, required: true, default: 1000 }
  - id: "priority-sites"
    name: "Unprotected priority sites"
    summary: "High-scoring habitat points that fall outside every protected area."
    group: "Conservation Planning"
    icon: pin
    params:
      - { name: "habitat", label: "Habitat points", kind: layer, required: true }
      - { name: "protected", label: "Protected areas", kind: layer, required: true }
      - { name: "score", label: "Score field", kind: field, required: true }
      - { name: "min_score", label: "Minimum score", kind: number, default: 1 }
  - id: "protection-gap"
    name: "Protection gap"
    summary: "How much of a habitat or range lies inside protected areas, and the unprotected gap, in hectares."
    group: "Conservation Planning"
    icon: globe
    params:
      - { name: "habitat", label: "Habitat / range", kind: layer, required: true }
      - { name: "protected", label: "Protected areas", kind: layer, required: true }
      - { name: "area", label: "Area method", kind: choice, default: "equalarea", description: "Equal-area (auto-centred LAEA, hectares) or spherical.", choices: ["equalarea", "spherical"] }
  - id: "representation"
    name: "Minimum-cost representation (SCP)"
    summary: "Cheapest set of planning units that meets a target for each feature (exact for ≤ 28 units, greedy above)."
    group: "Conservation Planning"
    icon: grid
    params:
      - { name: "units", label: "Planning units", kind: layer, required: true }
      - { name: "cost", label: "Cost field", kind: field, required: true }
      - { name: "targets", label: "Targets", kind: text, required: true, description: "field:target, … — e.g. \"frog_ha:50, forest_ha:200\"" }
  - id: "hotspot-grid"
    name: "Weighted hotspot grid"
    summary: "Hexagon or square grid scored by weighted counts, density or presence of up to three layers (descriptive, not Gi*)."
    group: "Conservation Planning"
    icon: grid
    params:
      - { name: "layer", label: "Layer 1", kind: layer, required: true }
      - { name: "weight", label: "Weight 1", kind: number, default: 1 }
      - { name: "layer2", label: "Layer 2", kind: layer }
      - { name: "weight2", label: "Weight 2", kind: number, default: 1 }
      - { name: "layer3", label: "Layer 3", kind: layer }
      - { name: "weight3", label: "Weight 3", kind: number, default: 1 }
      - { name: "cell_km", label: "Cell size (km)", kind: number, required: true, default: 5 }
      - { name: "shape", label: "Shape", kind: choice, default: "hex", choices: ["hex", "square"] }
      - { name: "score", label: "Score", kind: choice, default: "count", choices: ["count", "density", "presence"] }
  - id: "fragmentation"
    name: "Fragmentation and patch metrics"
    summary: "FRAGSTATS-style metrics (NP, CA, LPI, TE, ED, MSI, core area, CAI, ENN) and core-area polygons."
    group: "Landscape Ecology"
    icon: layers
    params:
      - { name: "patches", label: "Patches", kind: layer, required: true }
      - { name: "edge_m", label: "Core edge depth (m)", kind: number, default: 100 }
      - { name: "area", label: "Area method", kind: choice, default: "equalarea", description: "Equal-area (auto-centred LAEA, hectares) or spherical.", choices: ["equalarea", "spherical"] }
      - { name: "explode", label: "Each multipolygon part is a patch", kind: bool, default: true }
  - id: "connectivity"
    name: "Patch connectivity"
    summary: "Links patches closer than a threshold distance and reports the connected components."
    group: "Landscape Ecology"
    icon: hotspot
    params:
      - { name: "patches", label: "Patches", kind: layer, required: true }
      - { name: "threshold_m", label: "Link threshold (m)", kind: number, required: true, default: 500 }
  - id: "change"
    name: "Two-date change (loss, gain, persistence)"
    summary: "Compares two polygon layers of the same thing (forest, wetland, land cover) and reports loss, gain and the annual rate."
    group: "Landscape Ecology"
    icon: clock
    params:
      - { name: "t1", label: "Earlier extent", kind: layer, required: true }
      - { name: "t2", label: "Later extent", kind: layer, required: true }
      - { name: "year1", label: "Earlier year", kind: number }
      - { name: "year2", label: "Later year", kind: number }
      - { name: "area", label: "Area method", kind: choice, default: "equalarea", description: "Equal-area (auto-centred LAEA, hectares) or spherical.", choices: ["equalarea", "spherical"] }
  - id: "dbscan"
    name: "DBSCAN clusters"
    summary: "Density-based clusters of up to 2,000 points (haversine distance); noise stays as cluster −1."
    group: "Spatial Statistics › Point patterns"
    icon: hotspot
    params:
      - { name: "points", label: "Points", kind: layer, required: true }
      - { name: "min_points", label: "Minimum points", kind: number, default: 4 }
      - { name: "epsilon_m", label: "Radius (m)", kind: number, description: "Empty: from the median nearest-neighbour distance × multiplier." }
      - { name: "multiplier", label: "Automatic radius × ", kind: number, default: 1.5 }
  - id: "nearest-neighbour"
    name: "Occurrence pattern (Clark–Evans)"
    summary: "Nearest-neighbour ratio R and z-score: clustered, random-like or dispersed."
    group: "Spatial Statistics › Point patterns"
    icon: hotspot
    params:
      - { name: "points", label: "Points", kind: layer, required: true }
  - id: "diversity"
    name: "Richness and diversity"
    summary: "Species richness, Shannon H′, Simpson and evenness of an occurrence layer, overall and per area."
    group: "Biodiversity"
    icon: chart
    params:
      - { name: "occurrences", label: "Occurrences", kind: layer, required: true }
      - { name: "species", label: "Species field", kind: field, required: true }
      - { name: "areas", label: "Per area (optional)", kind: layer, description: "Polygons; each gets richness, Shannon and Simpson of the points inside." }
  - id: "spectral-index"
    name: "Spectral index and extent (Otsu)"
    summary: "NDVI, NDWI, NDBI, NBR or any band pair from a multiband image, with an automatic Otsu threshold and the area above it."
    group: "Image Analysis › Spectral indices"
    icon: satellite
    params:
      - { name: "image", label: "Image", kind: raster, required: true, description: "A multiband raster (Sentinel-2, Landsat, drone …)." }
      - { name: "index", label: "Index", kind: choice, default: "NDVI", description: "Formula (A − B) / (A + B); the bands below say which band is A and which is B.", choices: ["NDVI", "NDWI", "NDBI", "NBR", "CUSTOM"] }
      - { name: "band_a", label: "Band A", kind: number, default: 4, description: "NDVI/NDWI/NBR: near infrared; NDBI: SWIR. 1 = first band." }
      - { name: "band_b", label: "Band B", kind: number, default: 3, description: "NDVI: red; NDWI/NDBI: NIR or SWIR; NBR: SWIR2." }
      - { name: "threshold", label: "Threshold (blank = Otsu)", kind: number, description: "Cells at or above it count as the extent (vegetation, water, built-up, burnt …)." }
  - id: "raster-change"
    name: "Raster change (two dates)"
    summary: "After − before for one band of two images or index rasters, with Otsu thresholds for gain and loss and their areas."
    group: "Image Analysis › Change detection"
    icon: clock
    params:
      - { name: "before", label: "Before", kind: raster, required: true, description: "The earlier raster (an NDVI from Spectral index, a DEM, a classification score …)." }
      - { name: "after", label: "After", kind: raster, required: true, description: "The later raster; it is resampled onto the earlier one’s grid." }
      - { name: "band", label: "Band", kind: number, default: 1 }
  - id: "slope-zones"
    name: "Slope zones"
    summary: "Horn slope from a DEM in three zones (gentle, moderate, steep) with their areas; breaks in degrees."
    group: "Terrain › Slope zones"
    icon: image
    params:
      - { name: "dem", label: "Elevation (DEM)", kind: raster, required: true, description: "Metres; geographic or projected." }
      - { name: "breaks", label: "Breaks (°)", kind: text, default: "8, 20", description: "Two slopes that split gentle | moderate | steep." }
  - id: "sdm"
    name: "Species distribution model"
    summary: "BIOCLIM, Mahalanobis or presence-background logistic suitability from occurrences and environmental rasters, with spatially blocked cross-validation (AUC, TSS, Boyce)."
    group: "Species Distribution"
    icon: pin
    params:
      - { name: "occurrences", label: "Occurrences", kind: layer, required: true, description: "Presence points (e.g. Data › Species from GBIF)." }
      - { name: "covariates", label: "Environmental rasters", kind: rasters, required: true, description: "One or more rasters (all their bands are used), e.g. WorldClim bioclim from Data › Climate." }
      - { name: "method", label: "Method", kind: choice, default: "logistic", description: "logistic: presence vs background (a linear MaxEnt-like model); bioclim: percentile envelope; mahalanobis: distance to the presence mean.", choices: ["logistic", "bioclim", "mahalanobis"] }
      - { name: "background", label: "Background points", kind: number, default: 5000, description: "Random cells for presence-background fitting and evaluation." }
      - { name: "folds", label: "Cross-validation folds", kind: number, default: 5 }
      - { name: "future", label: "Future rasters (optional)", kind: rasters, description: "The same variables for a future climate (e.g. Data › Future climate, CMIP6), in the same order: adds future suitability and range gain / loss." }
      - { name: "block_deg", label: "Block size (°, blank = automatic)", kind: number, description: "Spatial blocks for cross-validation, in degrees; automatic: a sixth of the study area’s width, made smaller until the presences fall in at least twice as many blocks as folds." }
  - id: "local-moran"
    name: "Local Moran's I (clusters and outliers, LISA)"
    summary: "Where high values sit among high values (hot spots), low among low, and where a feature differs from its neighbours (outliers); with the global Moran's I and its scatterplot. As ArcGIS Pro's Cluster and Outlier Analysis and GeoDa's LISA."
    group: "Spatial Statistics › Clusters and outliers"
    icon: hotspot
    params:
      - { name: "layer", label: "Layer", kind: layer, required: true }
      - { name: "field", label: "Numeric field", kind: field, required: true, description: "The value to test, e.g. species richness, count, rate" }
      - { name: "neighbours", label: "Neighbours", kind: choice, default: "auto", description: "auto: polygons that touch (queen contiguity), points: the 8 nearest", choices: ["auto", "contiguity", "k-nearest", "distance"] }
      - { name: "k", label: "k (nearest)", kind: number, default: 8 }
      - { name: "distance_km", label: "Distance band (km)", kind: number, default: 0, description: "For \"distance\": neighbours within this distance" }
      - { name: "permutations", label: "Permutations", kind: number, default: 999 }
      - { name: "alpha", label: "Significance level", kind: number, default: 0.05 }
      - { name: "fdr", label: "False discovery rate correction", kind: bool, default: false, description: "Benjamini–Hochberg over all features (fewer, safer clusters)" }
      - { name: "seed", label: "Random seed", kind: number, default: 12345, description: "Same seed, same p-values" }
  - id: "elevation-profile"
    name: "Elevation profile"
    summary: "The terrain along a line over a DEM (each line its own profile), or through points that carry an elevation field (in their order, grouped by a field such as a transect): the chart, length, climb, descent and steepest slope."
    group: "Terrain › Profiles"
    icon: chart
    params:
      - { name: "layer", label: "Lines or points", kind: layer, required: true }
      - { name: "dem", label: "Elevation raster (DEM)", kind: raster, description: "For lines; points can use their own elevation field instead" }
      - { name: "elevation_field", label: "Elevation field (points)", kind: field, description: "e.g. elevation_m; used when no DEM is given" }
      - { name: "group_field", label: "One profile per (points)", kind: field, description: "e.g. transect" }
      - { name: "order_field", label: "Sort points by", kind: field, description: "e.g. site or distance along the transect; empty = the order in the layer" }
      - { name: "spacing_m", label: "Sample every (m)", kind: number, default: 0, description: "0 = half the DEM cell size" }
  - id: "datum-transform"
    name: "Datum and projection transformation"
    summary: "Transform coordinates between datums and projections (WGS 84, UTM, PNG94/PNGMG94, AGD66/AMG66, GDA94/GDA2020, MGA, NZTM or any PROJ string), from a layer, its coordinate fields or typed coordinates."
    group: "Surveying and cartography"
    icon: earth
    params:
      - { name: "layer", label: "Points or features", kind: layer, description: "Leave empty to transform typed coordinates instead." }
      - { name: "x_field", label: "Easting or longitude field", kind: field, description: "When the coordinates are in the attribute table (for example from a CSV) rather than the map position." }
      - { name: "y_field", label: "Northing or latitude field", kind: field }
      - { name: "coordinates", label: "Typed coordinates", kind: text, default: "", description: "One \"x y\" pair per line (easting northing, or longitude latitude), used when no layer is chosen." }
      - { name: "source_crs", label: "From", kind: text, default: "EPSG:4326", description: "The system the coordinates are in. For a layer without coordinate fields this is EPSG:4326, its map position." }
      - { name: "target_crs", label: "To", kind: text, default: "auto", description: "\"auto\" chooses the WGS 84 UTM zone of the data." }
  - id: "traverse-adjust"
    name: "Traverse adjustment (Bowditch, misclosure report)"
    summary: "A traverse from a start point and its legs (bearing and distance): misclosure, precision ratio (1 in N), compass-rule (Bowditch) adjustment, adjusted coordinates and the enclosed area."
    group: "Surveying and cartography"
    icon: calc
    params:
      - { name: "legs", label: "Legs (bearing distance)", kind: text, default: "", description: "One leg per line: whole-circle bearing then distance in metres, for example \"45.3020 120.55\" (DDD.MMSS), \"45°30'20\\\" 120.55\" or \"N45°30'E 120.55\"." }
      - { name: "start_e", label: "Start easting (m)", kind: number, default: 500000 }
      - { name: "start_n", label: "Start northing (m)", kind: number, default: 9000000 }
      - { name: "close_e", label: "Closing easting (blank = back to start)", kind: text, default: "" }
      - { name: "close_n", label: "Closing northing (blank = back to start)", kind: text, default: "" }
      - { name: "bearing_format", label: "Bearing format", kind: choice, default: "dms", description: "dms: DDD.MMSS when a bearing is a single number; decimal: decimal degrees.", choices: ["dms", "decimal"] }
      - { name: "crs", label: "Coordinate system of the traverse", kind: text, default: "EPSG:32755", description: "Used to place the traverse on the map." }
      - { name: "min_ratio", label: "Required precision (1 in N)", kind: number, default: 10000, description: "The traverse fails the check when its precision is worse than this (for example 1:10 000 for cadastral work)." }
  - id: "bearing-distance"
    name: "Bearings and distances (inverse)"
    summary: "Grid bearing (DMS) and distance of every side of lines and polygons, and the area of each polygon, in a projected system: the figures for a survey plan or field book."
    group: "Surveying and cartography"
    icon: ruler
    params:
      - { name: "layer", label: "Lines or polygons", kind: layer, required: true }
      - { name: "crs", label: "Grid (projected system)", kind: text, default: "auto", description: "\"auto\" uses the WGS 84 UTM zone of the data." }
  - id: "survey-plan"
    name: "Survey plan sheet (title block)"
    summary: "An A3 survey plan of lot polygons: bearings and distances on every boundary, areas, numbered marks with a coordinate schedule, north arrow, scale bar and a title block with the surveyor's certificate."
    group: "Surveying and cartography"
    icon: print
    params:
      - { name: "lots", label: "Lot or parcel polygons", kind: layer, required: true }
      - { name: "label_field", label: "Lot label field", kind: field }
      - { name: "title", label: "Plan title", kind: text, default: "Survey plan" }
      - { name: "plan_no", label: "Plan number", kind: text, default: "" }
      - { name: "location", label: "Location", kind: text, default: "" }
      - { name: "surveyor", label: "Surveyor", kind: text, default: "" }
      - { name: "firm", label: "Firm", kind: text, default: "in4metrix" }
      - { name: "date", label: "Date (blank = today)", kind: text, default: "" }
      - { name: "crs", label: "Grid (projected system)", kind: text, default: "auto", description: "EPSG code (for example EPSG:32755, EPSG:5551 PNGMG94 zone 55, EPSG:20255 AMG66 zone 55) or a PROJ string." }
  - id: "map-grid"
    name: "Map grid and graticule (for layouts)"
    summary: "Grid lines at a set interval over a layer's extent: a latitude and longitude graticule, or an easting and northing grid in any projected system, labelled for a map layout."
    group: "Surveying and cartography"
    icon: grid
    params:
      - { name: "layer", label: "Extent of", kind: layer, required: true }
      - { name: "crs", label: "Grid system", kind: text, default: "EPSG:4326", description: "EPSG:4326 for a graticule, a projected system (or \"auto\" for UTM) for a grid." }
      - { name: "interval", label: "Interval (degrees or metres)", kind: number, default: 0, description: "0 chooses about eight lines across." }
  - id: "corridor-zones"
    name: "Corridor and clearance zones (power lines, pipelines, roads)"
    summary: "Nested zones either side of lines (easement, clearance, consultation …) as polygons with their areas, and every feature of a second layer that falls inside a zone (encroachments), with its distance."
    group: "Energy and utilities"
    icon: tBuffer
    params:
      - { name: "lines", label: "Lines (power lines, pipelines, roads)", kind: layer, required: true }
      - { name: "zones", label: "Zones (name:half-width in metres)", kind: text, default: "easement:20, clearance:40, consultation:100", description: "Half-widths either side of the centre line, for example easement:20, clearance:40." }
      - { name: "features", label: "Features to check (buildings, trees, wells …)", kind: layer }
  - id: "lidar-clearance"
    name: "LiDAR vegetation and obstacle clearance"
    summary: "Cells of a canopy or obstacle height model (from LiDAR) inside a line corridor that rise closer than the required clearance to the conductor: where to trim, with the excess height and area."
    group: "Energy and utilities"
    icon: pointcloud
    params:
      - { name: "chm", label: "Canopy or obstacle height (m above ground)", kind: raster, required: true, description: "A height above ground raster, for example a LiDAR canopy height model (DSM minus DTM)." }
      - { name: "lines", label: "Conductors or pipelines", kind: layer, required: true }
      - { name: "height_field", label: "Conductor height field (m above ground)", kind: field, description: "The lowest conductor height (at maximum sag) on each line; blank uses the height below." }
      - { name: "conductor_m", label: "Conductor height (m above ground)", kind: number, default: 12 }
      - { name: "clearance_m", label: "Required clearance (m)", kind: number, default: 3, description: "The vegetation clearance the regulator or utility requires." }
      - { name: "corridor_m", label: "Corridor half-width (m)", kind: number, default: 15 }
  - id: "tower-inventory"
    name: "Transmission tower inventory (spans and angles)"
    summary: "Towers or poles in line order: span lengths, line deviation at each structure, a suggested structure type (suspension, angle, terminal) and spans longer than allowed."
    group: "Energy and utilities"
    icon: pin
    params:
      - { name: "towers", label: "Towers or poles (points)", kind: layer, required: true }
      - { name: "line", label: "Line route (optional, orders the towers)", kind: layer }
      - { name: "id_field", label: "Tower number field", kind: field }
      - { name: "max_span_m", label: "Longest allowed span (m)", kind: number, default: 450 }
      - { name: "angle_deg", label: "Deviation for an angle structure (°)", kind: number, default: 3 }
      - { name: "terminal_deg", label: "Deviation for a terminal structure (°)", kind: number, default: 30 }
  - id: "tenure-check"
    name: "Tenure check (leases, licences, tenements)"
    summary: "Areas of petroleum leases, mining tenements or other licences, overlaps between them, overlaps with constraint areas (protected or customary land) and licences expired or expiring."
    group: "Tenure and leases"
    icon: mapOutline
    params:
      - { name: "tenures", label: "Leases or tenements (polygons)", kind: layer, required: true }
      - { name: "name_field", label: "Name or number field", kind: field }
      - { name: "expiry_field", label: "Expiry date field", kind: field }
      - { name: "warn_days", label: "Warn this many days before expiry", kind: number, default: 180 }
      - { name: "constraints", label: "Constraint areas (optional)", kind: layer }
      - { name: "as_of", label: "Check as of (date, blank = today)", kind: text, default: "" }
  - id: "well-sites"
    name: "Well sites (spacing and lease check)"
    summary: "Wells or drill holes: the lease each is in, wells outside every lease, the distance to the nearest other well and wells closer than the minimum spacing."
    group: "Tenure and leases"
    icon: point
    params:
      - { name: "wells", label: "Wells or drill holes (points)", kind: layer, required: true }
      - { name: "leases", label: "Leases (polygons, optional)", kind: layer }
      - { name: "lease_name", label: "Lease name field", kind: field }
      - { name: "min_spacing_m", label: "Minimum spacing (m)", kind: number, default: 400 }
  - id: "route-suitability"
    name: "Least-cost route (pipelines, haul and logging roads)"
    summary: "The cheapest route between two points across a DEM (grade-limited) or a cost surface, avoiding no-go areas: for pipeline, haul road and logging road alignments, with length and grades."
    group: "Route planning"
    icon: roadCentre
    params:
      - { name: "surface", label: "DEM or cost surface", kind: raster, required: true }
      - { name: "ends", label: "Start and end (points: first and last)", kind: layer, required: true }
      - { name: "surface_kind", label: "The surface is", kind: choice, default: "dem", description: "dem: cost grows with slope and cells steeper than the maximum grade are impassable; cost: the raster values are the cost per metre.", choices: ["dem", "cost"] }
      - { name: "max_grade_deg", label: "Maximum grade (°)", kind: number, default: 12, description: "For a DEM: cells steeper than this are impassable (haul roads are often 6 to 10 %, about 3.5 to 5.7°)." }
      - { name: "avoid", label: "No-go areas (optional)", kind: layer, description: "Protected areas, villages, water bodies: never crossed." }
  - id: "volume-change"
    name: "Cut and fill volumes (open pit, stockpiles)"
    summary: "Volume removed and added between two DEMs of the same grid (open pits, waste dumps, stockpiles, earthworks), within an optional boundary, with the change raster."
    group: "Earthworks"
    icon: cube
    params:
      - { name: "before", label: "DEM before", kind: raster, required: true }
      - { name: "after", label: "DEM after", kind: raster, required: true }
      - { name: "boundary", label: "Boundary (optional)", kind: layer }
      - { name: "min_change_m", label: "Ignore changes smaller than (m)", kind: number, default: 0.1, description: "Survey noise threshold." }
