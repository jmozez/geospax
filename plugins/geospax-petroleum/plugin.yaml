# GeoSpaX Oil and gas plugin, one of the default domain plugins. Generated by plugins/gsx/gen-manifest.mjs
# (do not edit by hand); its tools run from the shared GSX library in plugins/gsx.
plugin: geospax-petroleum
version: 3.0.1
title: "Oil and gas"
description: "Well sites and spacing, petroleum lease tenure checks, pipeline route suitability, pipeline corridor zones and surface change."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
default: true
run: node --no-warnings ${plugin}/../gsx/run.mjs ${tool}
tools:
  - id: "well-sites"
    name: "Well sites (spacing and lease check)"
    summary: "Wells or drill holes: the lease each is in, wells outside every lease, the distance to the nearest other well and wells closer than the minimum spacing."
    group: "Oil and gas"
    icon: point
    params:
      - { name: "wells", label: "Wells or drill holes (points)", kind: layer, required: true }
      - { name: "leases", label: "Leases (polygons, optional)", kind: layer }
      - { name: "lease_name", label: "Lease name field", kind: field }
      - { name: "min_spacing_m", label: "Minimum spacing (m)", kind: number, default: 400 }
  - id: "tenure-check"
    name: "Tenure check (leases, licences, tenements)"
    summary: "Areas of petroleum leases, mining tenements or other licences, overlaps between them, overlaps with constraint areas (protected or customary land) and licences expired or expiring."
    group: "Oil and gas"
    icon: mapOutline
    params:
      - { name: "tenures", label: "Leases or tenements (polygons)", kind: layer, required: true }
      - { name: "name_field", label: "Name or number field", kind: field }
      - { name: "expiry_field", label: "Expiry date field", kind: field }
      - { name: "warn_days", label: "Warn this many days before expiry", kind: number, default: 180 }
      - { name: "constraints", label: "Constraint areas (optional)", kind: layer }
      - { name: "as_of", label: "Check as of (date, blank = today)", kind: text, default: "" }
  - id: "route-suitability"
    name: "Least-cost route (pipelines, haul and logging roads)"
    summary: "The cheapest route between two points across a DEM (grade-limited) or a cost surface, avoiding no-go areas: for pipeline, haul road and logging road alignments, with length and grades."
    group: "Oil and gas"
    icon: roadCentre
    params:
      - { name: "surface", label: "DEM or cost surface", kind: raster, required: true }
      - { name: "ends", label: "Start and end (points: first and last)", kind: layer, required: true }
      - { name: "surface_kind", label: "The surface is", kind: choice, default: "dem", description: "dem: cost grows with slope and cells steeper than the maximum grade are impassable; cost: the raster values are the cost per metre.", choices: ["dem", "cost"] }
      - { name: "max_grade_deg", label: "Maximum grade (°)", kind: number, default: 12, description: "For a DEM: cells steeper than this are impassable (haul roads are often 6 to 10 %, about 3.5 to 5.7°)." }
      - { name: "avoid", label: "No-go areas (optional)", kind: layer, description: "Protected areas, villages, water bodies: never crossed." }
  - id: "corridor-zones"
    name: "Corridor and clearance zones (power lines, pipelines, roads)"
    summary: "Nested zones either side of lines (easement, clearance, consultation …) as polygons with their areas, and every feature of a second layer that falls inside a zone (encroachments), with its distance."
    group: "Oil and gas"
    icon: tBuffer
    params:
      - { name: "lines", label: "Lines (power lines, pipelines, roads)", kind: layer, required: true }
      - { name: "zones", label: "Zones (name:half-width in metres)", kind: text, default: "easement:20, clearance:40, consultation:100", description: "Half-widths either side of the centre line, for example easement:20, clearance:40." }
      - { name: "features", label: "Features to check (buildings, trees, wells …)", kind: layer }
  - id: "raster-change"
    name: "Raster change (two dates)"
    summary: "After − before for one band of two images or index rasters, with Otsu thresholds for gain and loss and their areas."
    group: "Oil and gas"
    icon: clock
    params:
      - { name: "before", label: "Before", kind: raster, required: true, description: "The earlier raster (an NDVI from Spectral index, a DEM, a classification score …)." }
      - { name: "after", label: "After", kind: raster, required: true, description: "The later raster; it is resampled onto the earlier one’s grid." }
      - { name: "band", label: "Band", kind: number, default: 1 }
  - id: "elevation-profile"
    name: "Elevation profile"
    summary: "The terrain along a line over a DEM (each line its own profile), or through points that carry an elevation field (in their order, grouped by a field such as a transect): the chart, length, climb, descent and steepest slope."
    group: "Oil and gas"
    icon: chart
    params:
      - { name: "layer", label: "Lines or points", kind: layer, required: true }
      - { name: "dem", label: "Elevation raster (DEM)", kind: raster, description: "For lines; points can use their own elevation field instead" }
      - { name: "elevation_field", label: "Elevation field (points)", kind: field, description: "e.g. elevation_m; used when no DEM is given" }
      - { name: "group_field", label: "One profile per (points)", kind: field, description: "e.g. transect" }
      - { name: "order_field", label: "Sort points by", kind: field, description: "e.g. site or distance along the transect; empty = the order in the layer" }
      - { name: "spacing_m", label: "Sample every (m)", kind: number, default: 0, description: "0 = half the DEM cell size" }
