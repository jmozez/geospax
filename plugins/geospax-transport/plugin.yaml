# GeoSpaX Transport and logistics plugin, one of the default domain plugins. Generated by plugins/gsx/gen-manifest.mjs
# (do not edit by hand); its tools run from the shared GSX library in plugins/gsx.
plugin: geospax-transport
version: 3.0.1
title: "Transport and logistics"
description: "Drive-time and distance service areas over a road network, delivery route optimisation, access to services and corridor zones."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
default: true
run: node --no-warnings ${plugin}/../gsx/run.mjs ${tool}
tools:
  - id: "service-area"
    name: "Service areas (drive time or distance)"
    summary: "The parts of a road network reachable from depots, clinics or other facilities within time or distance bands, and the nearest facility for each demand point."
    group: "Transport and logistics"
    icon: road
    params:
      - { name: "network", label: "Road network (lines)", kind: layer, required: true }
      - { name: "facilities", label: "Facilities (points)", kind: layer, required: true }
      - { name: "bands", label: "Bands (minutes, or metres without a speed)", kind: text, default: "10, 20, 30" }
      - { name: "speed_field", label: "Speed field (km/h)", kind: field }
      - { name: "speed_kmh", label: "Default speed (km/h, 0 = distance)", kind: number, default: 40 }
      - { name: "demand", label: "Demand points (optional)", kind: layer }
  - id: "route-optimise"
    name: "Delivery route optimisation"
    summary: "The shortest order to visit a set of stops from a depot (nearest neighbour improved by 2-opt), over a road network or in straight lines, with the route and leg lengths."
    group: "Transport and logistics"
    icon: roadCentre
    params:
      - { name: "stops", label: "Stops (points; the first is the depot)", kind: layer, required: true }
      - { name: "network", label: "Road network (optional)", kind: layer }
      - { name: "return", label: "Return to the depot", kind: choice, default: "yes", choices: ["yes", "no"] }
      - { name: "speed_field", label: "Speed field (km/h)", kind: field }
      - { name: "speed_kmh", label: "Default speed (km/h, 0 = distance)", kind: number, default: 0 }
  - id: "service-access"
    name: "Access to services (clinics, schools, markets)"
    summary: "Travel distance or time from each village or household to the nearest service, over roads and tracks or in straight lines, with the population beyond each threshold."
    group: "Transport and logistics"
    icon: home
    params:
      - { name: "settlements", label: "Villages or households (points)", kind: layer, required: true }
      - { name: "services", label: "Services (points)", kind: layer, required: true }
      - { name: "network", label: "Roads and tracks (optional)", kind: layer }
      - { name: "speed_field", label: "Speed field (km/h)", kind: field }
      - { name: "speed_kmh", label: "Default speed (km/h, 0 = distance)", kind: number, default: 0 }
      - { name: "pop_field", label: "Population field (optional)", kind: field }
      - { name: "thresholds", label: "Thresholds (km or minutes)", kind: text, default: "5, 10, 20" }
  - id: "corridor-zones"
    name: "Corridor and clearance zones (power lines, pipelines, roads)"
    summary: "Nested zones either side of lines (easement, clearance, consultation …) as polygons with their areas, and every feature of a second layer that falls inside a zone (encroachments), with its distance."
    group: "Transport and logistics"
    icon: tBuffer
    params:
      - { name: "lines", label: "Lines (power lines, pipelines, roads)", kind: layer, required: true }
      - { name: "zones", label: "Zones (name:half-width in metres)", kind: text, default: "easement:20, clearance:40, consultation:100", description: "Half-widths either side of the centre line, for example easement:20, clearance:40." }
      - { name: "features", label: "Features to check (buildings, trees, wells …)", kind: layer }
  - id: "route-suitability"
    name: "Least-cost route (pipelines, haul and logging roads)"
    summary: "The cheapest route between two points across a DEM (grade-limited) or a cost surface, avoiding no-go areas: for pipeline, haul road and logging road alignments, with length and grades."
    group: "Transport and logistics"
    icon: roadCentre
    params:
      - { name: "surface", label: "DEM or cost surface", kind: raster, required: true }
      - { name: "ends", label: "Start and end (points: first and last)", kind: layer, required: true }
      - { name: "surface_kind", label: "The surface is", kind: choice, default: "dem", description: "dem: cost grows with slope and cells steeper than the maximum grade are impassable; cost: the raster values are the cost per metre.", choices: ["dem", "cost"] }
      - { name: "max_grade_deg", label: "Maximum grade (°)", kind: number, default: 12, description: "For a DEM: cells steeper than this are impassable (haul roads are often 6 to 10 %, about 3.5 to 5.7°)." }
      - { name: "avoid", label: "No-go areas (optional)", kind: layer, description: "Protected areas, villages, water bodies: never crossed." }
