# GeoSpaX Asset management plugin, one of the default domain plugins. Generated by plugins/gsx/gen-manifest.mjs
# (do not edit by hand); its tools run from the shared GSX library in plugins/gsx.
plugin: geospax-assets
version: 3.0.1
title: "Asset management"
description: "Asset registers with age, inspections due and risk, change alerts between snapshots, and corridor encroachments."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
default: true
run: node --no-warnings ${plugin}/../gsx/run.mjs ${tool}
tools:
  - id: "asset-register"
    name: "Asset register (age, inspections, risk)"
    summary: "For each asset (poles, pumps, bridges, culverts, pipes): age and remaining life, the next inspection and whether it is overdue, and a risk score from condition and criticality."
    group: "Asset management"
    icon: database
    params:
      - { name: "assets", label: "Assets", kind: layer, required: true }
      - { name: "installed_field", label: "Installed date or year field", kind: field }
      - { name: "life_years", label: "Design life (years)", kind: number, default: 40 }
      - { name: "inspected_field", label: "Last inspection date field", kind: field }
      - { name: "interval_months", label: "Inspection interval (months)", kind: number, default: 12 }
      - { name: "condition_field", label: "Condition field (1 very good to 5 very poor)", kind: field }
      - { name: "criticality_field", label: "Criticality field (1 to 5)", kind: field }
      - { name: "as_of", label: "As of (date, blank = today)", kind: text, default: "" }
  - id: "change-alert"
    name: "Asset change alerts (compare two snapshots)"
    summary: "Assets added, removed, moved or with changed attributes between an earlier and a later snapshot of the same layer, matched by id."
    group: "Asset management"
    icon: alert
    params:
      - { name: "before", label: "Earlier snapshot", kind: layer, required: true }
      - { name: "after", label: "Later snapshot", kind: layer, required: true }
      - { name: "id_field", label: "Id field", kind: field, required: true }
      - { name: "fields", label: "Attributes to compare (blank = all)", kind: text, default: "" }
      - { name: "move_m", label: "Moved if shifted more than (m)", kind: number, default: 1 }
  - id: "corridor-zones"
    name: "Corridor and clearance zones (power lines, pipelines, roads)"
    summary: "Nested zones either side of lines (easement, clearance, consultation …) as polygons with their areas, and every feature of a second layer that falls inside a zone (encroachments), with its distance."
    group: "Asset management"
    icon: tBuffer
    params:
      - { name: "lines", label: "Lines (power lines, pipelines, roads)", kind: layer, required: true }
      - { name: "zones", label: "Zones (name:half-width in metres)", kind: text, default: "easement:20, clearance:40, consultation:100", description: "Half-widths either side of the centre line, for example easement:20, clearance:40." }
      - { name: "features", label: "Features to check (buildings, trees, wells …)", kind: layer }
  - id: "tower-inventory"
    name: "Transmission tower inventory (spans and angles)"
    summary: "Towers or poles in line order: span lengths, line deviation at each structure, a suggested structure type (suspension, angle, terminal) and spans longer than allowed."
    group: "Asset management"
    icon: pin
    params:
      - { name: "towers", label: "Towers or poles (points)", kind: layer, required: true }
      - { name: "line", label: "Line route (optional, orders the towers)", kind: layer }
      - { name: "id_field", label: "Tower number field", kind: field }
      - { name: "max_span_m", label: "Longest allowed span (m)", kind: number, default: 450 }
      - { name: "angle_deg", label: "Deviation for an angle structure (°)", kind: number, default: 3 }
      - { name: "terminal_deg", label: "Deviation for a terminal structure (°)", kind: number, default: 30 }
