# GeoSpaX Climate plugin, one of the default domain plugins. Generated by plugins/gsx/gen-manifest.mjs
# (do not edit by hand); its tools run from the shared GSX library in plugins/gsx.
plugin: geospax-climate
version: 3.0.1
title: "Climate"
description: "ENSO indices (ONI, Niño 3.4, SOI), rainfall anomalies, El Niño drought and frost risk, seasonal outlooks, moisture and burn stress, climate vulnerability and change."
author: in4metrix
license: MIT
homepage: https://github.com/jmozez/geospax
kind: process
geojson: true
default: true
run: node --no-warnings ${plugin}/../gsx/run.mjs ${tool}
tools:
  - id: "enso-index"
    name: "ENSO index (ONI, Niño 3.4, SOI)"
    summary: "The latest El Niño Southern Oscillation index from NOAA CPC or the Bureau of Meteorology, the ENSO phase and strength, and a chart of recent values."
    group: "Climate"
    icon: lineChart
    params:
      - { name: "index", label: "Index", kind: choice, default: "oni", description: "oni: NOAA Oceanic Niño Index (official El Niño measure); nino34: weekly Niño 3.4 SST anomaly; soi: BoM Southern Oscillation Index.", choices: ["oni", "nino34", "soi"] }
      - { name: "periods", label: "Recent periods to show", kind: number, default: 36 }
      - { name: "file", label: "Data file (optional, instead of downloading)", kind: file, description: "A copy of the NOAA or BoM text file, for offline use." }
  - id: "rainfall-anomaly"
    name: "Rainfall anomaly (percent of normal)"
    summary: "Observed rainfall as a percentage of the long-term normal (for example CHIRPS month or season against its climatology), in classes from very much below to very much above normal."
    group: "Climate"
    icon: d-hydrology
    params:
      - { name: "observed", label: "Observed rainfall (mm)", kind: raster, required: true }
      - { name: "normal", label: "Normal (long-term mean) rainfall (mm)", kind: raster, required: true }
  - id: "drought-risk"
    name: "El Niño drought and frost risk"
    summary: "Drought risk classes from a rainfall anomaly (percent of normal) and the current ENSO state (ONI), with highland frost risk above a set elevation during El Niño: for food security and water supply planning in PNG."
    group: "Climate"
    icon: d-disaster
    params:
      - { name: "rain_pct", label: "Rainfall (% of normal, optional)", kind: raster }
      - { name: "dem", label: "DEM (optional, for frost)", kind: raster }
      - { name: "oni", label: "ONI (°C, blank = latest from NOAA)", kind: number, description: "Leave blank to download the latest Oceanic Niño Index." }
      - { name: "oni_file", label: "ONI data file (optional, offline)", kind: file }
      - { name: "frost_m", label: "Frost risk above (m)", kind: number, default: 2200 }
  - id: "seasonal-outlook"
    name: "Seasonal rainfall outlook classes"
    summary: "Classes from a seasonal outlook probability raster (the chance of rainfall above the median, as from the BoM ACCESS-S, IRI or NOAA forecasts): very likely drier to very likely wetter."
    group: "Climate"
    icon: d-climate
    params:
      - { name: "probability", label: "Chance of above-median rainfall (%)", kind: raster, required: true }
      - { name: "scale", label: "The values are", kind: choice, default: "percent", choices: ["percent", "fraction"] }
  - id: "spectral-index"
    name: "Spectral index and extent (Otsu)"
    summary: "NDVI, NDWI, NDBI, NBR or any band pair from a multiband image, with an automatic Otsu threshold and the area above it."
    group: "Climate"
    icon: satellite
    params:
      - { name: "image", label: "Image", kind: raster, required: true, description: "A multiband raster (Sentinel-2, Landsat, drone …)." }
      - { name: "index", label: "Index", kind: choice, default: "NDVI", description: "Formula (A − B) / (A + B); the bands below say which band is A and which is B.", choices: ["NDVI", "NDWI", "NDBI", "NBR", "CUSTOM"] }
      - { name: "band_a", label: "Band A", kind: number, default: 4, description: "NDVI/NDWI/NBR: near infrared; NDBI: SWIR. 1 = first band." }
      - { name: "band_b", label: "Band B", kind: number, default: 3, description: "NDVI: red; NDWI/NDBI: NIR or SWIR; NBR: SWIR2." }
      - { name: "threshold", label: "Threshold (blank = Otsu)", kind: number, description: "Cells at or above it count as the extent (vegetation, water, built-up, burnt …)." }
  - id: "suitability"
    name: "Weighted suitability (WLC)"
    summary: "Weighted linear combination of numeric fields, each rescaled 0–1; optional constraint field forces zero."
    group: "Climate"
    icon: chart
    params:
      - { name: "layer", label: "Features", kind: layer, required: true }
      - { name: "criteria", label: "Criteria", kind: text, required: true, description: "field:weight, … — add :- when lower is better, e.g. \"forest_pct:3, road_km:1:-\"" }
      - { name: "constraint", label: "Constraint field", kind: field, description: "Features where this is true score zero." }
  - id: "distance-decay"
    name: "Distance-decay suitability"
    summary: "Score features by a distance field with exponential decay: 1 at zero distance, 0.5 at the half-life."
    group: "Climate"
    icon: chart
    params:
      - { name: "layer", label: "Features", kind: layer, required: true }
      - { name: "field", label: "Distance field (m)", kind: field, required: true }
      - { name: "half_life", label: "Half-life (m)", kind: number, required: true, default: 1000 }
  - id: "raster-change"
    name: "Raster change (two dates)"
    summary: "After − before for one band of two images or index rasters, with Otsu thresholds for gain and loss and their areas."
    group: "Climate"
    icon: clock
    params:
      - { name: "before", label: "Before", kind: raster, required: true, description: "The earlier raster (an NDVI from Spectral index, a DEM, a classification score …)." }
      - { name: "after", label: "After", kind: raster, required: true, description: "The later raster; it is resampled onto the earlier one’s grid." }
      - { name: "band", label: "Band", kind: number, default: 1 }
  - id: "change"
    name: "Two-date change (loss, gain, persistence)"
    summary: "Compares two polygon layers of the same thing (forest, wetland, land cover) and reports loss, gain and the annual rate."
    group: "Climate"
    icon: clock
    params:
      - { name: "t1", label: "Earlier extent", kind: layer, required: true }
      - { name: "t2", label: "Later extent", kind: layer, required: true }
      - { name: "year1", label: "Earlier year", kind: number }
      - { name: "year2", label: "Later year", kind: number }
      - { name: "area", label: "Area method", kind: choice, default: "equalarea", description: "Equal-area (auto-centred LAEA, hectares) or spherical.", choices: ["equalarea", "spherical"] }
