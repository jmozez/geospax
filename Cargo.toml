[workspace]
resolver = "3"
members = ["crates/engine", "crates/server", "apps/desktop/src-tauri"]
default-members = ["crates/engine", "crates/server"]

[workspace.package]
version = "3.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
geospax-engine = { path = "crates/engine" }
gdal = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
lru = "0.16"
arrow-array = { version = "60", features = ["ffi"] }
arrow-schema = "60"
arrow-ipc = "60"
arrow-buffer = "60"
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd", "flate2", "flate2-rust_backend"] }
bytes = "1"
pmtiles = { version = "0.24", default-features = false, features = ["write"] }
flate2 = "1.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "cors"] }

[profile.dev]
debug = 0                      # smaller, faster dev builds
[profile.dev.package."*"]
opt-level = 2                  # optimise dependencies even in dev builds

[profile.release]
lto = "thin"
codegen-units = 4
