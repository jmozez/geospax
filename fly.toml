# fly.toml app configuration file generated for geospax on 2026-10-26T04:03:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'geospax'
primary_region = 'syd'

[experimental]
  entrypoint = ['geospax-server', '--host', '0.0.0.0', '--port', '8080', '--data', '/srv/data', '--state-dir', '/srv/state', '--no-device-mounts']

[build]
  image = 'ghcr.io/jmozez/geospax:latest'

[[mounts]]
  source = 'geospax_data'
  destination = '/srv'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
